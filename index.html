function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function score(f){let h=0;for(const c of f.n)h+=c.charCodeAt(0);return {r:(4.3+(h%7)/10).toFixed(1),t:(4.2+(h%8)/10).toFixed(1)}}
function palette(cat){return {甜品:["#f6c4cf","#fff1f5"],奶茶:["#d8b28c","#fff4e7"],饮品:["#a8d6c6","#f0fbf7"],烧烤:["#e59a68","#fff0df"],火锅:["#df7661","#fff0ea"],海鲜:["#8ec8d2","#effbfc"],早餐:["#e3bd78","#fff6df"],夜宵:["#bb8a72","#fff0e9"],小吃:["#e5b46c","#fff4df"],主食:["#d4ad73","#fff5df"],正餐:["#d69a7a","#fff0e8"],家常菜:["#c7a679","#fff5e5"]}[cat]||["#d9b8a5","#fff2ea"]}
function art(f){
  const [a,b]=palette(f.cat),n=esc(f.n),id=f.id.replace(/\W/g,""),name=f.n;
  let scene="";
  const plate="<ellipse cx='600' cy='465' rx='330' ry='105' fill='#fff' stroke='#d7c5bd' stroke-width='8'/>";
  if(/螺蛳粉|米线|粉|面|面线|炒面|炒粉|拉面/.test(name)) scene=plate+"<path d='M385 435 Q470 350 555 435 T725 435' fill='none' stroke='#d7a56e' stroke-width='30' stroke-linecap='round'/><path d='M410 420 Q500 335 590 420 T770 420' fill='none' stroke='#f0c47b' stroke-width='20' stroke-linecap='round'/><circle cx='470' cy='475' r='24' fill='#7ca16c'/><circle cx='680' cy='480' r='25' fill='#d36c54'/>';
  else if(/炒饭|盖饭|卤肉饭|煲仔饭|海胆饭|焗饭|米饭|饭团/.test(name)) scene=plate+"<ellipse cx='600' cy='425' rx='190' ry='95' fill='#f0d59c'/><ellipse cx='540' cy='400' rx='55' ry='32' fill='#fff2c7'/><path d='M610 410q80-70 145 0' fill='none' stroke='#b56f4e' stroke-width='28' stroke-linecap='round'/><circle cx='485' cy='450' r='24' fill='#79a66d'/>";
  else if(/牛肉|羊肉|五花肉|排骨|肉夹馍|叉烧|肘子|扣肉|鸡翅|炸鸡|鸡米花|猪蹄|鸭脖|鸭翅|鸭舌|腊肉/.test(name)) scene=plate+"<rect x='430' y='355' width='135' height='70' rx='24' fill='#9e4d38' transform='rotate(-12 500 390)'/><rect x='555' y='400' width='150' height='72' rx='24' fill='#c56c45' transform='rotate(8 630 435)'/><rect x='675' y='350' width='115' height='68' rx='22' fill='#8e4434' transform='rotate(-8 730 385)'/><path d='M430 330q160-75 360 0' fill='none' stroke='#e2a25e' stroke-width='14' stroke-dasharray='10 18'/>";
  else if(/串/.test(name)) scene="<rect x='285' y='350' width='630' height='300' rx='80' fill='#fff' stroke='#d7c5bd' stroke-width='8'/><path d='M360 500 L840 300' stroke='#b17a50' stroke-width='12'/><circle cx='440' cy='468' r='45' fill='#b85e40'/><circle cx='560' cy='418' r='45' fill='#d8894f'/><circle cx='680' cy='368' r='45' fill='#b65b3e'/><circle cx='800' cy='318' r='45' fill='#d28a52'/>";
  else if(/关东煮/.test(name)) scene="<ellipse cx='600' cy='475' rx='290' ry='120' fill='#fff' stroke='#c8b3aa' stroke-width='9'/><ellipse cx='600' cy='450' rx='245' ry='88' fill='#e5bd83'/><rect x='470' y='360' width='42' height='155' rx='18' fill='#e7d2a7'/><rect x='570' y='335' width='48' height='180' rx='18' fill='#f0e1bd'/><rect x='675' y='350' width='48' height='165' rx='18' fill='#d9a56d'/><circle cx='493' cy='370' r='38' fill='#fff1d3'/><circle cx='594' cy='340' r='42' fill='#e7c58e'/><path d='M700 335q35-55 70 0' fill='none' stroke='#e7d0aa' stroke-width='34'/>";
  else if(/饺|包|烧麦|馄饨|小笼|生煎|锅贴/.test(name)) scene="<ellipse cx='600' cy='465' rx='310' ry='105' fill='#fff' stroke='#d7c5bd' stroke-width='8'/><path d='M390 445q35-105 105 0q-35 55-105 0M500 445q35-115 105 0q-35 55-105 0M610 445q35-115 105 0q-35 55-105 0M720 445q35-105 100 0q-35 55-100 0' fill='#e8c18e' stroke='#c99462' stroke-width='7'/>";
  else if(/蛋糕|提拉米苏|泡芙|蛋挞|千层|布丁|布蕾|派|可颂|冰淇淋|圣代|双皮奶|芋圆|糯米糍/.test(name)) scene="<path d='M385 360 L815 360 L735 540 Q600 600 465 540Z' fill='#f2d1a5' stroke='#c99370' stroke-width='8'/><path d='M420 360q180-115 360 0' fill='none' stroke='#fff' stroke-width='52'/><circle cx='520' cy='330' r='38' fill='#e86d76'/><circle cx='650' cy='315' r='35' fill='#8db36f'/>";
  else if(/奶茶|鲜奶茶|波波|厚乳|奶盖|椰椰|乌龙|奶绿/.test(name)) scene="<rect x='455' y='190' width='290' height='350' rx='55' fill='#fff' stroke='#6b5147' stroke-width='8'/><path d='M475 335h250v145q-125 65-250 0z' fill='#c49a70'/><circle cx='525' cy='470' r='18' fill='#5c4035'/><circle cx='590' cy='485' r='18' fill='#5c4035'/><circle cx='655' cy='470' r='18' fill='#5c4035'/><path d='M565 200L680 55' stroke='#6b5147' stroke-width='15' stroke-linecap='round'/>";
  else if(/咖啡|拿铁|美式|冰茶|气泡水|果汁|柠檬|茶/.test(name)) scene="<path d='M470 300h260l-35 260q-95 55-190 0z' fill='#fff' stroke='#76574b' stroke-width='8'/><path d='M495 390h210v150q-105 45-210 0z' fill='#b56f4e'/><circle cx='530' cy='365' r='25' fill='#efb47d'/><circle cx='610' cy='350' r='20' fill='#9ac28f'/>";
  else if(/火锅|锅/.test(name)) scene="<ellipse cx='600' cy='465' rx='320' ry='135' fill='#653b32'/><ellipse cx='600' cy='435' rx='275' ry='105' fill='"+a+"'/><path d='M600 330v205' stroke='#fff8' stroke-width='7'/><circle cx='500' cy='425' r='38' fill='#e7a05f'/><circle cx='690' cy='420' r='40' fill='#8caf78'/><path d='M540 470q60-55 120 0' fill='none' stroke='#d56f55' stroke-width='25'/>";
  else if(/鱼|刺身|寿司|生蚝|扇贝|虾|蟹|龙虾|花甲|鱿鱼|贝|海鲜/.test(name)) scene=plate+"<path d='M380 450q130-160 300-20q120 95 230-25q-60 180-245 105q-170 90-285-60z' fill='#e47d68'/><circle cx='790' cy='390' r='45' fill='#f0c58b'/><circle cx='455' cy='425' r='30' fill='#9bc4d0'/>";
  else if(/早餐|油条|煎饼|三明治|豆浆|粥/.test(name)) scene="<ellipse cx='600' cy='480' rx='300' ry='100' fill='#fff' stroke='#d7c5bd' stroke-width='8'/><rect x='420' y='390' width='250' height='75' rx='22' fill='#e7bd78' transform='rotate(-8 540 425)'/><rect x='650' y='370' width='70' height='150' rx='35' fill='#e1c49b' transform='rotate(8 685 445)'/>";
  else scene=plate+"<ellipse cx='500' cy='420' rx='85' ry='58' fill='"+a+"'/><ellipse cx='650' cy='400' rx='95' ry='62' fill='#e8b47a'/><circle cx='735' cy='455' r='35' fill='#8bab75'/>";
  return "<div class='art'><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 700'><defs><linearGradient id='g"+id+"' x1='0' y1='0' x2='1' y2='1'><stop stop-color='"+a+"'/><stop offset='1' stop-color='"+b+"'/></linearGradient></defs><rect width='1200' height='700' fill='url(#g"+id+")'/><circle cx='1030' cy='90' r='175' fill='#fff7'/>"+scene+"<text x='600' y='105' text-anchor='middle' font-size='52' font-family='sans-serif' font-weight='900' fill='#4b352c'>"+n+"</text><text x='600' y='650' text-anchor='middle' font-size='22' font-family='sans-serif' fill='#755f55'>"+esc(f.cat)+" · 美食插画</text></svg></div>"
}
function visual(f,small=false){return "<div class='"+(small?"miniVisual":"itemVisual")+"'>"+(f.img?"<img src='"+f.img+"' alt='"+esc(f.n)+"'>":art(f))+"</div>"}
function activeFoods(){return source==="system"?systemFoods:customFoods}
function activeCats(){return source==="system"?systemCats:customCats}
function list(){return activeFoods().filter(f=>category==="全部"||f.cat===category)}
function render(){
  if(!activeCats().includes(category))category="全部";
  $("cats").innerHTML=["全部"].concat(activeCats()).map(c=>"<button type='button' class='catbtn "+(c===category?"on":"")+"' data-c='"+esc(c)+"'><span class='catIcon'>"+(catIcon[c]||"🍽️")+"</span>"+esc(c)+" <span>"+activeFoods().filter(f=>c==="全部"||f.cat===c).length+"</span></button>").join("");
  document.querySelectorAll(".catbtn").forEach(b=>b.onclick=()=>{category=b.dataset.c;render()});
  $("systemCount").textContent=systemFoods.length+"道";$("customCount").textContent=customFoods.length+"道";$("count").textContent="当前可抽："+list().length+"道";
  $("details").innerHTML=list().length?list().map(f=>{const s=score(f);return "<div class='item'>"+visual(f)+"<div><b>"+esc(f.n)+"</b><small>"+esc(f.cat)+" · "+esc(f.region||"我的菜单")+"</small><small>推荐 "+s.r+" · 口味 "+s.t+"</small></div><div class='itemActions'><button type='button' onclick='editFood(""+f.id+"")'>改名字</button><button type='button' class='fileBtn'>换照片<input type='file' accept='image/*' onchange='uploadFoodImage(""+f.id+"",this)'></button><button type='button' onclick='deleteFood(""+f.id+"")'>删除</button></div></div>"}).join(""):"<div class='empty'>这一类还没有菜品。</div>";
  document.querySelectorAll(".source").forEach(b=>b.classList.toggle("on",b.dataset.source===source));
  $("managerBox").className="custom show";$("managerTitle").textContent=source==="system"?"⚙️ 系统菜单管理":"✍️ 我的菜单管理";
  renderManager();
}
function renderManager(){
  $("foodCat").innerHTML=activeCats().map(c=>"<option>"+esc(c)+"</option>").join("");
  $("catManager").innerHTML="<div class='catManager'>"+activeCats().map((c,i)=>"<div class='catRow'><span>"+(catIcon[c]||"🍽️")+" "+esc(c)+" · "+activeFoods().filter(f=>f.cat===c).length+"道</span><button type='button' onclick='renameCat("+i+")'>改名</button><button type='button' onclick='deleteCat("+i+")'>删除</button></div>").join("")+"</div>";
}
window.renameCat=function(i){const cats=activeCats(),old=cats[i],n=prompt("把“"+old+"”改成：",old);if(!n||!n.trim()||n.trim()===old)return;const nn=n.trim();if(cats.includes(nn))return alert("这个分类已经存在");cats[i]=nn;activeFoods().forEach(f=>{if(f.cat===old)f.cat=nn});save(source==="system"?"food_system_cats_v4":"food_custom_cats_v4",cats);save(source==="system"?"food_system_v4":"food_custom_v4",activeFoods());category=nn;render()};
window.deleteCat=function(i){const cats=activeCats();if(cats.length<=1)return alert("至少保留一个分类");const old=cats[i],target=cats[i===0?1:0];if(!confirm("删除“"+old+"”？该分类菜品会移到“"+target+"”。"))return;activeFoods().forEach(f=>{if(f.cat===old)f.cat=target});cats.splice(i,1);save(source==="system"?"food_system_cats_v4":"food_custom_cats_v4",cats);save(source==="system"?"food_system_v4":"food_custom_v4",activeFoods());category="全部";render()};
window.editFood=function(id){const arr=activeFoods(),f=arr.find(x=>x.id===id);if(!f)return;const n=prompt("修改菜品名称：",f.n);if(!n||!n.trim())return;f.n=n.trim();save(source==="system"?"food_system_v4":"food_custom_v4",arr);render()};
window.deleteFood=function(id){const arr=activeFoods(),f=arr.find(x=>x.id===id);if(f&&confirm("确定删除“"+f.n+"”？")){if(source==="system")systemFoods=arr.filter(x=>x.id!==id);else customFoods=arr.filter(x=>x.id!==id);save(source==="system"?"food_system_v4":"food_custom_v4",source==="system"?systemFoods:customFoods);render()}};
window.uploadFoodImage=function(id,input){const file=input.files&&input.files[0];if(!file)return;const arr=activeFoods(),f=arr.find(x=>x.id===id);if(!f)return;const rd=new FileReader();rd.onload=()=>{f.img=rd.result;save(source==="system"?"food_system_v4":"food_custom_v4",arr);render()};rd.readAsDataURL(file)};
function addCategory(){const n=$("newCat").value.trim();if(!n)return;const cats=activeCats();if(cats.includes(n))return alert("分类已经存在");cats.push(n);$("newCat").value="";save(source==="system"?"food_system_cats_v4":"food_custom_cats_v4",cats);render()}
function addFood(){const n=$("foodName").value.trim(),c=$("foodCat").value;if(!n)return alert("请输入菜品名称");const file=$("foodFile").files[0];const f={id:(source==="system"?"s":"c")+Date.now(),n,cat:c,e:"🍽️",region:source==="system"?"自定义系统菜品":"我的菜单"};const done=()=>{if(source==="system")systemFoods.push(f);else customFoods.push(f);save(source==="system"?"food_system_v4":"food_custom_v4",source==="system"?systemFoods:customFoods);$("foodName").value="";$("foodFile").value="";render()};if(file){const rd=new FileReader();rd.onload=()=>{f.img=rd.result;done()};rd.readAsDataURL(file)}else done()}
function showResult(f){current=f;const s=score(f);$("resultVisual").innerHTML=visual(f);$("resultCat").textContent=(catIcon[f.cat]||"🍽️")+" "+f.cat;$("resultName").textContent=f.n;$("resultDesc").textContent=f.n+"，这是一道"+f.cat+"美食，适合"+(f.region&&f.region!=="全国"?f.region+"风味":"今晚")+"想吃这一口的时候直接决定。";$("recommend").textContent=s.r+"/5";$("taste").textContent=s.t+"/5";$("resultRegion").textContent="📍 "+(f.region||"我的菜单")+" · "+f.cat;$("result").classList.add("show");celebrate()}
function playTone(freq,dur,type="sine",delay=0){if(!audioCtx||!musicOn)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.0001,audioCtx.currentTime+delay);g.gain.exponentialRampToValueAtTime(.06,audioCtx.currentTime+delay+.02);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+delay+dur);o.connect(g);g.connect(audioCtx.destination);o.start(audioCtx.currentTime+delay);o.stop(audioCtx.currentTime+delay+dur+.03)}
function drawSound(){[523,659,784,988].forEach((f,i)=>playTone(f,.16,"triangle",i*.09))}
function winSound(){[659,784,988,1318].forEach((f,i)=>playTone(f,.22,"sine",i*.08))}
function startMusic(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume();musicOn=true;$("musicBtn").classList.add("on");$("musicBtn").textContent="🎵 音乐中";let notes=[262,330,392,330,294,349,440,392],i=0;clearInterval(musicTimer);musicTimer=setInterval(()=>{if(musicOn)playTone(notes[i++%notes.length],.22,"sine",0)},430)}
function stopMusic(){musicOn=false;clearInterval(musicTimer);$("musicBtn").classList.remove("on");$("musicBtn").textContent="🎵 音乐"}
function celebrate(){winSound();for(let i=0;i<34;i++){const el=document.createElement("i");el.className="confetti";el.style.left=(10+Math.random()*80)+"vw";el.style.setProperty("--x",(Math.random()*180-90)+"px");el.style.animationDelay=(Math.random()*.35)+"s";document.body.appendChild(el);setTimeout(()=>el.remove(),2300)}for(let i=0;i<18;i++){const el=document.createElement("i");el.className="fire";el.style.setProperty("--x",(Math.random()*300-150)+"px");el.style.setProperty("--y",(Math.random()*260-130)+"px");document.body.appendChild(el);setTimeout(()=>el.remove(),1000)}}
function draw(){const a=list();if(!a.length)return alert("当前分类还没有菜品");const winner=a[Math.floor(Math.random()*a.length)],seq=[];for(let i=0;i<13;i++)seq.push(a[Math.floor(Math.random()*a.length)]);seq[11]=winner;$("draw").classList.add("show");$("result").classList.remove("show");$("drawTitle").textContent="正在抽取……";$("track").innerHTML=seq.map(f=>"<div class='mini'>"+visual(f,true)+"<b>"+esc(f.n)+"</b></div>").join("");const tr=$("track");tr.style.transition="none";tr.style.transform="translateX(0)";drawSound();requestAnimationFrame(()=>{tr.style.transition="transform 2.5s cubic-bezier(.1,.8,.15,1)";tr.style.transform="translateX(-"+(11*133-66)+"px)"});setTimeout(()=>{$("drawTitle").textContent="✨ 决定好了！";showResult(winner);history.push(winner);history=history.slice(-30);save("food_hist_v4",history);renderRecords()},2650)}
function renderRecords(){const arr=$("favTab").dataset.on==="1"?favorites:history;$("records").innerHTML=arr.length?arr.slice().reverse().map(f=>"<div class='row'>"+visual(f,true)+"<div><b>"+esc(f.n)+"</b><small>"+esc(f.cat)+" · "+esc(f.region||"我的菜单")+"</small></div></div>").join(""):"<div class='empty'>还没有记录</div>"}
document.querySelectorAll(".mood").forEach(b=>b.onclick=()=>{document.querySelectorAll(".mood").forEach(x=>x.classList.remove("on"));b.classList.add("on")});
document.querySelectorAll(".source").forEach(b=>b.onclick=()=>{source=b.dataset.source;category="全部";render()});
$("start").onclick=draw;$("again").onclick=draw;$("addFood").onclick=addFood;$("addCat").onclick=addCategory;
$("like").onclick=()=>{if(!current)return;if(!favorites.some(x=>x.n===current.n)){favorites.push(current);save("food_fav_v4",favorites)}$("like").textContent="💖 已收藏";renderRecords()};
$("favTab").onclick=()=>{$("favTab").dataset.on="1";renderRecords()};$("histTab").onclick=()=>{$("favTab").dataset.on="0";renderRecords()};
$("musicBtn").onclick=()=>musicOn?stopMusic():startMusic();render();renderRecords();
</script></body></html>
