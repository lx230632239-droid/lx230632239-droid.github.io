function art(f){const bg=color(f.cat),name=esc(f.n),emo=esc(f.e||"🍽️");let food="<ellipse cx='600' cy='405' rx='245' ry='105' fill='#fff'/><circle cx='500' cy='390' r='44' fill='#df9b68'/><circle cx='620' cy='430' r='42' fill='#d47d5f'/><circle cx='710' cy='395' r='37' fill='#86a86b'/>";if(f.cat==="奶茶"||f.cat==="饮品")food="<rect x='500' y='155' width='200' height='350' rx='45' fill='#fff' stroke='#6c5145' stroke-width='8'/><rect x='520' y='270' width='160' height='215' rx='30' fill='"+bg+"'/><path d='M570 160L650 50' stroke='#6c5145' stroke-width='16' stroke-linecap='round'/>";if(f.cat==="火锅")food="<ellipse cx='600' cy='420' rx='285' ry='145' fill='#633a32'/><ellipse cx='600' cy='390' rx='240' ry='105' fill='"+bg+"'/><circle cx='490' cy='390' r='38' fill='#e9b86f'/><circle cx='600' cy='430' r='36' fill='#7fa36b'/><circle cx='700' cy='375' r='34' fill='#dd875f'/>";if(f.cat==="甜品")food="<path d='M420 390L780 390L700 510Q600 550 500 510Z' fill='"+bg+"'/><circle cx='520' cy='380' r='48' fill='#ed9da9'/><circle cx='635' cy='360' r='50' fill='#efc36f'/>";if(f.cat==="烧烤")food="<rect x='360' y='390' width='480' height='90' rx='25' fill='#8c5140'/><circle cx='470' cy='435' r='40' fill='#db9661'/><circle cx='600' cy='435' r='40' fill='#e0ad70'/><circle cx='730' cy='435' r='40' fill='#c97552'/>";if(f.cat==="海鲜")food="<path d='M390 430Q510 300 650 370Q750 420 820 350Q760 500 625 460Q490 520 390 430Z' fill='#e68868'/>";if(f.cat==="主食")food="<ellipse cx='600' cy='420' rx='240' ry='110' fill='#fff'/><path d='M440 410Q600 300 760 410M450 450Q600 350 750 450' stroke='#d39c68' stroke-width='27' fill='none' stroke-linecap='round'/>";return "<div class='art'><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 700'><defs><linearGradient id='g"+esc(f.id)+"' x1='0' y1='0' x2='1' y2='1'><stop stop-color='"+bg+"'/><stop offset='1' stop-color='#fff1e7'/></linearGradient></defs><rect width='1200' height='700' fill='url(#g"+esc(f.id)+")'/><circle cx='1040' cy='90' r='180' fill='#fff8'/><text x='600' y='115' text-anchor='middle' font-size='54'>"+emo+"</text>"+food+"<text x='600' y='610' text-anchor='middle' font-size='42' font-family='sans-serif' font-weight='900' fill='#4b352c'>"+name+"</text><text x='600' y='652' text-anchor='middle' font-size='22' font-family='sans-serif' fill='#755f55'>"+esc(f.cat)+" · 美食插画</text></svg></div>"}
function visual(f){return f.img?"<img src='"+f.img+"' alt='"+esc(f.n)+"'>":art(f)}
function base(){return source==="system"?foods:custom}
function cats(){return source==="system"?["全部"].concat(SYSTEM_CATS):["全部"].concat(customCats)}
function list(){return base().filter(f=>category==="全部"||f.cat===category)}
function render(){if(!cats().includes(category))category="全部";$("cats").innerHTML=cats().map(c=>"<button type='button' class='cat "+(c===category?"on":"")+"' data-c='"+esc(c)+"'>"+esc(c)+" <span>"+base().filter(f=>c==="全部"||f.cat===c).length+"</span></button>").join("");document.querySelectorAll(".cat").forEach(b=>b.onclick=()=>{category=b.dataset.c;render()});$("systemCount").textContent=foods.length+"道";$("customCount").textContent=custom.length+"道";$("count").textContent="当前可抽："+list().length+"道";$("details").innerHTML=list().length?list().map(f=>"<div class='item'>"+visual(f)+"<b>"+esc(f.n)+"</b><small>"+esc(f.cat)+" · "+esc(f.region||"我的菜单")+"</small>"+(source==="custom"?"<div class='itemActions'><button type='button' onclick='editFood(\""+f.id+"\")'>修改</button><button type='button' onclick='deleteFood(\""+f.id+"\")'>删除</button></div>":"")+"</div>").join(""):"<div class='empty'>这一类还没有菜品。</div>";document.querySelectorAll(".source").forEach(b=>b.classList.toggle("on",b.dataset.source===source));$("customBox").className="custom"+(source==="custom"?" show":"");if(source==="custom")renderManager()}
function renderManager(){$("customCat").innerHTML=customCats.map(c=>"<option>"+esc(c)+"</option>").join("");$("catManager").innerHTML="<div class='catManager'>"+customCats.map((c,i)=>"<div class='catRow'><span>"+esc(c)+" · "+custom.filter(f=>f.cat===c).length+"道</span><button type='button' onclick='renameCat("+i+")'>改名</button><button type='button' onclick='deleteCat("+i+")'>删除</button></div>").join("")+"</div>"}
window.renameCat=function(i){const old=customCats[i],n=prompt("把“"+old+"”改成：",old);if(!n||!n.trim()||n.trim()===old)return;if(customCats.includes(n.trim()))return alert("这个分类已经存在");const nn=n.trim();customCats[i]=nn;custom.forEach(f=>{if(f.cat===old)f.cat=nn});save("food_cats_v3",customCats);save("food_custom_v3",custom);category=nn;render()}
window.deleteCat=function(i){if(customCats.length<=1)return alert("至少保留一个分类");const old=customCats[i],target=customCats[i===0?1:0];if(!confirm("删除“"+old+"”？里面的菜会移到“"+target+"”。"))return;custom.forEach(f=>{if(f.cat===old)f.cat=target});customCats.splice(i,1);save("food_cats_v3",customCats);save("food_custom_v3",custom);category="全部";render()}
window.editFood=function(id){const f=custom.find(x=>x.id===id);if(!f)return;const n=prompt("修改菜品名称：",f.n);if(n&&n.trim())f.n=n.trim();const c=prompt("修改分类：\n"+customCats.join("、"),f.cat);if(c&&customCats.includes(c.trim()))f.cat=c.trim();save("food_custom_v3",custom);render()}
window.deleteFood=function(id){const f=custom.find(x=>x.id===id);if(f&&confirm("确定删除“"+f.n+"”？")){custom=custom.filter(x=>x.id!==id);save("food_custom_v3",custom);render()}}
function addCategory(){const n=$("newCat").value.trim();if(!n)return;if(customCats.includes(n))return alert("分类已经存在");customCats.push(n);$("newCat").value="";save("food_cats_v3",customCats);render()}
function addFood(){const n=$("customName").value.trim(),c=$("customCat").value;if(!n)return alert("请输入菜品名称");const file=$("customFile").files[0];const f={id:"c"+Date.now(),n:n,cat:c,e:"🍽️",region:"我的菜单"};const done=()=>{custom.push(f);save("food_custom_v3",custom);$("customName").value="";$("customFile").value="";render()};if(file){const rd=new FileReader();rd.onload=()=>{f.img=rd.result;done()};rd.readAsDataURL(file)}else done()}
function showResult(f){current=f;$("resultVisual").innerHTML=visual(f);$("resultCat").textContent=(f.e||"🍽️")+" "+f.cat;$("resultName").textContent=f.n;$("resultDesc").textContent=f.n+"，这是一道"+f.cat+"美食，适合今晚想吃这一口的时候直接决定。";$("resultRegion").textContent="📍 "+(f.region||"我的菜单")+" · "+f.cat;$("result").classList.add("show")}
function draw(){const a=list();if(!a.length)return alert("当前分类还没有菜品");const winner=a[Math.floor(Math.random()*a.length)],seq=[];for(let i=0;i<11;i++)seq.push(a[Math.floor(Math.random()*a.length)]);seq[9]=winner;$("draw").classList.add("show");$("result").classList.remove("show");$("drawTitle").textContent="正在抽取……";$("track").innerHTML=seq.map(f=>"<div class='mini'>"+visual(f)+"<b>"+esc(f.n)+"</b></div>").join("");const tr=$("track");tr.style.transition="none";tr.style.transform="translateX(0)";requestAnimationFrame(()=>{tr.style.transition="transform 2.2s cubic-bezier(.1,.8,.15,1)";tr.style.transform="translateX(-"+(9*136-72)+"px)"});setTimeout(()=>{$("drawTitle").textContent="✨ 决定好了";showResult(winner);history.push(winner);history=history.slice(-30);save("food_hist_v3",history);renderRecords()},2300)}
function renderRecords(){const a=$("favTab").dataset.on==="1"?favorites:history;$("records").innerHTML=a.length?a.slice().reverse().map(f=>"<div class='row'>"+visual(f)+"<div><b>"+esc(f.n)+"</b><small>"+esc(f.cat)+" · "+esc(f.region||"我的菜单")+"</small></div></div>").join(""):"<div class='empty'>还没有记录</div>"}
document.querySelectorAll(".mood").forEach(b=>b.onclick=()=>{document.querySelectorAll(".mood").forEach(x=>x.classList.remove("on"));b.classList.add("on")});
document.querySelectorAll(".source").forEach(b=>b.onclick=()=>{source=b.dataset.source;category="全部";render()});
$("start").onclick=draw;$("again").onclick=draw;$("add").onclick=addFood;$("addCat").onclick=addCategory;$("like").onclick=()=>{if(!current)return;if(!favorites.some(x=>x.n===current.n)){favorites.push(current);save("food_fav_v3",favorites)}$("like").textContent="💖 已收藏";renderRecords()};$("favTab").onclick=()=>{$("favTab").dataset.on="1";renderRecords()};$("histTab").onclick=()=>{$("favTab").dataset.on="0";renderRecords()};render();renderRecords();</script></body></html>
