<!doctype html>
<html lang="zh-CN">
<head>

<title>吃点啥？· 美食决定器｜最终版</title>
<style>
*{box-sizing:border-box}
:root{--bg:#fff8f2;--card:#fff;--ink:#30231e;--muted:#9b8980;--line:#eaded7;--accent:#e97868;--accent2:#f3a06f;--soft:#fff1e8}
body{margin:0;background:linear-gradient(180deg,#fff8f2 0%,#fffdfb 70%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
button,input,select{font:inherit}.app{max-width:760px;margin:auto;padding:10px 14px 90px}
.top{display:flex;align-items:center;justify-content:space-between;padding:8px 2px 12px}
.brand{font-size:17px;font-weight:950}.sub{font-size:10px;color:var(--muted);margin-top:3px}
.card{background:rgba(255,255,255,.96);border:1px solid #f1e5de;border-radius:24px;box-shadow:0 12px 35px #6d483710}
.hero{text-align:center;padding:18px 8px 16px}.hero .eyebrow{font-size:11px;color:#bd6952;font-weight:900}.hero h1{font-size:38px;line-height:1.1;margin:8px 0}.hero p{font-size:12px;color:var(--muted);line-height:1.7;margin:0}
.controls{padding:13px}.moods,.sources,.cats{display:flex;gap:7px;overflow:auto;scrollbar-width:none}.moods::-webkit-scrollbar,.sources::-webkit-scrollbar,.cats::-webkit-scrollbar{display:none}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;white-space:nowrap;font-size:10px;color:#705f57}.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.field label{display:block;font-size:9px;color:var(--muted);font-weight:900;margin:0 0 5px}.field select{width:100%;height:38px;border:1px solid var(--line);border-radius:11px;background:#fff;padding:0 8px;font-size:10px}
.menu{margin-top:10px;padding:11px;border:1px solid #f0e2d9;border-radius:17px;background:#fffaf7}.label{font-size:10px;font-weight:950;color:#806d64;margin-bottom:7px}.count{font-size:9px;color:var(--muted);margin-top:7px}
.details{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px;max-height:390px;overflow:auto;padding-right:2px}.item{border:1px solid #eee1d8;border-radius:15px;padding:6px;background:#fff}.itemTop{display:flex;gap:7px;align-items:center}.itemPhoto{width:64px;height:64px;flex:0 0 64px;border-radius:11px;overflow:hidden;background:#fff3eb}.itemPhoto img{width:100%;height:100%;object-fit:cover;display:block}.itemName{font-size:11px;font-weight:900;line-height:1.35}.item small{display:block;color:var(--muted);font-size:8px;margin-top:3px}.itemActions{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.tiny{border:0;background:#f8eee8;border-radius:8px;padding:5px 7px;font-size:8px;color:#76564b}.tiny.danger{color:#a34d47}
.managerToggle{width:100%;margin-top:10px;border:1px dashed #e9cfc2;background:#fff7f2;color:#a95745;border-radius:13px;padding:10px;font-size:10px;font-weight:950;text-align:left}
.managerBox{display:none!important;margin-top:9px;padding:10px;border:1px solid var(--line);border-radius:16px;background:#fff}.managerBox.show{display:block!important;animation:slide .18s ease}
.managerGrid{display:grid;grid-template-columns:1fr 110px;gap:6px}.managerGrid input,.managerGrid select{width:100%;height:36px;border:1px solid var(--line);border-radius:10px;padding:0 8px;font-size:10px;background:#fff}.managerGrid .wide{grid-column:1/-1}.managerGrid button{height:36px;border:0;border-radius:10px;background:var(--soft);color:#a95745;font-weight:950;font-size:10px}
.uploadTip{font-size:8px;color:var(--muted);line-height:1.5;margin-top:6px}.catManager{margin-top:8px}.catRow{display:flex;gap:5px;align-items:center;padding:5px 0;border-bottom:1px dashed #eee1d8}.catRow span{flex:1;font-size:9px}.catRow button{border:0;background:#f8eee8;border-radius:7px;padding:5px;font-size:8px;color:#76564b}
.start{width:100%;margin-top:11px;border:0;border-radius:16px;padding:14px;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;font-size:16px;font-weight:950;box-shadow:0 8px 18px #e8786928}.start small{display:block;font-size:9px;margin-top:3px;font-weight:500}
.musicBtn{position:fixed;right:14px;top:14px;z-index:80;width:42px;height:42px;border:2px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(48,35,30,.94);color:#fff;font-size:19px;box-shadow:0 6px 20px #0003}.musicBtn.on{background:#d86f69}
.musicPanel{display:none;position:fixed;right:12px;top:64px;z-index:81;width:205px;background:rgba(255,252,249,.98);border:1px solid var(--line);border-radius:17px;padding:11px;box-shadow:0 12px 35px #0002}.musicPanel.show{display:block;animation:pop .18s ease}.musicPanel h4{margin:0 0 8px;font-size:11px}.musicModes{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.musicPanel button{border:0;border-radius:9px;background:#f8eee8;color:#76564b;padding:7px 2px;font-size:9px;font-weight:900}.musicPanel button.on{background:#d86f69;color:#fff}.musicUpload{margin-top:7px;width:100%;display:block;text-align:center;background:#f8eee8;border-radius:9px;padding:7px;font-size:9px;color:#76564b}.musicUpload input{display:none}.musicHint{font-size:8px;color:var(--muted);line-height:1.5;margin-top:5px}
.draw{display:none;margin-top:12px;padding:12px;text-align:center}.draw.show{display:block}.drawTitle{font-weight:950;font-size:14px;margin-bottom:8px}.trackBox{position:relative;height:150px;overflow:hidden;border-radius:18px;background:#fff8f3}.track{height:100%;display:flex;align-items:center;gap:9px;will-change:transform}.trackBox:before{content:"";position:absolute;z-index:4;left:50%;top:0;bottom:0;width:3px;background:var(--accent);transform:translateX(-50%);box-shadow:0 0 12px var(--accent)}.mini{flex:0 0 124px;height:125px;background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:0 5px 12px #0000000b}.miniPhoto{height:88px;background:#fff3eb}.miniPhoto img{width:100%;height:100%;object-fit:cover;display:block}.mini b{display:block;font-size:10px;padding:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result{display:none;margin-top:12px;overflow:hidden}.result.show{display:block;animation:pop .45s ease}.resultPhoto{height:300px;background:#fff3eb;position:relative}.resultPhoto img{width:100%;height:100%;object-fit:cover;display:block}.resultPhoto .photoLoading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#b08e80;font-size:11px}.info{padding:16px}.tag{font-size:10px;color:#bd6952;font-weight:950}.name{font-size:30px;font-weight:950;margin-top:5px}.desc{font-size:12px;color:#776961;line-height:1.7;margin:8px 0}.scoreBox{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.score{background:#fff7f1;border:1px solid #f0e2d9;border-radius:13px;padding:10px}.score strong{display:block;font-size:18px}.score span{font-size:9px;color:#9b867c}.region{background:#fff7f1;border:1px solid #f0e2d9;border-radius:12px;padding:10px;font-size:10px;line-height:1.6}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:10px}.actions button{border:0;border-radius:12px;padding:11px 5px;font-size:10px;font-weight:950}.again{background:var(--ink);color:#fff}.like{background:#fff0f2;color:#b15c6c}.share{background:#fff4e8;color:#9a674e}
.records{margin-top:12px;padding:12px}.recordTabs{display:grid;grid-template-columns:1fr 1fr;gap:7px}.recordTabs button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px;font-size:10px;color:#76564b;font-weight:900}.recordTabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}.recordTools{display:flex;justify-content:flex-end;margin-top:7px}.recordTools button{border:0;background:transparent;color:#b05e52;font-size:9px}.row{display:flex;gap:8px;align-items:center;padding:8px;border:1px solid #eee1d8;border-radius:12px;margin-top:6px}.rowPhoto{width:44px;height:44px;flex:0 0 44px;border-radius:9px;overflow:hidden;background:#fff3eb}.rowPhoto img{width:100%;height:100%;object-fit:cover;display:block}.rowMain{flex:1;min-width:0}.row b{font-size:10px}.row small{display:block;color:var(--muted);font-size:8px;margin-top:2px}.row button{border:0;background:#f8eee8;border-radius:8px;padding:5px 7px;font-size:8px;color:#a34d47}.empty{text-align:center;color:var(--muted);font-size:10px;padding:16px}
.placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#fff1e8,#f8e4d9);color:#a97865;font-weight:950;font-size:13px;text-align:center;padding:8px}
.confetti{position:fixed;z-index:99;top:-20px;width:8px;height:13px;border-radius:2px;animation:fall 1.7s linear forwards}.fire{position:fixed;z-index:98;left:50%;top:42%;width:8px;height:8px;border-radius:50%;background:#f6a15b;animation:burst .8s ease-out forwards}
@keyframes pop{0%{transform:scale(.96);opacity:0}100%{transform:scale(1);opacity:1}}@keyframes slide{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}@keyframes fall{to{transform:translate3d(var(--x),110vh,0) rotate(720deg);opacity:0}}@keyframes burst{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
@media(max-width:520px){.app{padding-left:12px;padding-right:12px}.details{grid-template-columns:1fr 1fr}.managerGrid{grid-template-columns:1fr 104px}.resultPhoto{height:270px}.name{font-size:28px}.actions{grid-template-columns:1fr 1fr 1fr}}
</style>
</head>
<body>
<main class="app">
  <div class="top"><div><div class="brand">🍽️ 吃点啥？</div><div class="sub">让今晚吃什么，不再纠结</div></div></div>
  <section class="hero"><div class="eyebrow">🎁 美食盲盒 · 最终版</div><h1>吃点啥？</h1><p>先筛选，再抽取；照片、收藏、记录、菜单管理各自归位。</p></section>

  <section class="card controls">
    <div class="moods"><button class="pill on mood">🎲 随便吃</button><button class="pill mood">🌶️ 想吃辣</button><button class="pill mood">🥩 想吃肉</button><button class="pill mood">🍰 想吃甜</button><button class="pill mood">🧋 想喝点</button></div>
    <div class="filters">
      <div class="field"><label>预算</label><select id="budget"><option>¥20以内</option><option selected>¥20–50</option><option>¥50–100</option><option>¥100+</option></select></div>
      <div class="field"><label>人数</label><select id="people"><option>单人</option><option selected>双人</option><option>三到五人</option><option>六到八人</option><option>团建</option></select></div>
      <div class="field"><label>口味</label><select id="tasteFilter"><option>随便</option><option>清淡</option><option>重口</option><option>酸辣</option><option>甜口</option></select></div>
    </div>

    <div class="menu">
      <div class="label">🎁 选择菜单</div>
      <div class="sources"><button class="pill source on" data-source="system">系统菜单 <span id="systemCount"></span></button><button class="pill source" data-source="custom">我的菜单 <span id="customCount"></span></button></div>
      <div class="label" style="margin-top:11px">🍽️ 分类</div>
      <div class="cats" id="cats"></div>
      <div class="count" id="count"></div>
      <div class="details" id="details"></div>

      <button class="managerToggle" id="managerToggle" type="button">⚙️ 菜单管理 <span style="float:right">点击展开 / 收起</span></button>
      <div class="managerBox" id="managerBox">
        <div class="label">✍️ 当前菜单管理</div>
        <div class="managerGrid">
          <input id="foodName" placeholder="输入菜品名称">
          <select id="foodCat"></select>
          <input id="foodFile" class="wide" type="file" accept="image/*">
          <button id="addFood" type="button">＋添加菜品</button>
        </div>
        <div class="uploadTip">📷 可从手机相册给菜品上传真实照片；上传后优先使用你的照片。系统菜品统一使用清爽的动漫卡通美食图；你也可以给自己的菜品上传照片。</div>
        <div class="label" style="margin-top:10px">🗂️ 分类管理</div>
        <div class="managerGrid"><input id="newCat" placeholder="例如：我最爱吃"><button id="addCat" type="button">＋新增分类</button></div>
        <div id="catManager"></div>
      </div>
    </div>
    <button class="start" id="start" type="button">🎁 开始抽美食<small>中文菜名 · 对应图片 · 抽到什么吃什么</small></button>
  </section>

  <section class="card draw" id="draw"><div class="drawTitle" id="drawTitle">正在抽取……</div><div class="trackBox"><div class="track" id="track"></div></div></section>

  <section class="card result" id="result">
    <div class="resultPhoto" id="resultPhoto"><div class="photoLoading">正在调取对应美食照片…</div></div>
    <div class="info">
      <div class="tag" id="resultCat"></div><div class="name" id="resultName"></div><p class="desc" id="resultDesc"></p>
      <div class="scoreBox"><div class="score"><strong id="recommend"></strong><span>推荐指数</span></div><div class="score"><strong id="taste"></strong><span>口味评分</span></div></div>
      <div class="region" id="resultRegion"></div>
      <div class="actions"><button class="again" id="again">🎲 再抽</button><button class="like" id="like">❤️ 收藏</button><button class="share" id="share">📤 分享</button></div>
    </div>
  </section>

  <section class="card records">
    <div class="recordTabs"><button id="favTab" class="on">❤️ 收藏</button><button id="histTab">🕘 抽取记录</button></div>
    <div class="recordTools"><button id="clearRecords">清空当前列表</button></div>
    <div id="records"></div>
  </section>
</main>

<button class="musicBtn" id="musicBtn" aria-label="音乐设置">🎵</button>
<div class="musicPanel" id="musicPanel">
  <h4>🎵 氛围音乐</h4>
  <div class="musicModes"><button data-mood="warm" class="on">温馨</button><button data-mood="happy">欢快</button><button data-mood="food">食欲</button></div>
  <label class="musicUpload">📁 添加手机音乐<input id="musicFile" type="file" accept="audio/*"></label>
  <div class="musicHint">右上角圆圈只负责展开/收起，不再占页面空间。你也可以直接选手机里的音乐。</div>
</div>

async function commonsImage(f){
  if(f.img)return f.img;
  if(imgCache[f.n])return imgCache[f.n];
  const q=queryMap[f.n]||f.n+" food";
  const url="https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch="+encodeURIComponent(q)+"&gsrnamespace=6&gsrlimit=8&prop=imageinfo&iiprop=url|mime&iiurlwidth=700&format=json&origin=*";
  try{
    const r=await fetch(url);const j=await r.json();const pages=Object.values(j.query?.pages||{});
    const hit=pages.find(p=>p.imageinfo?.[0]?.mime?.startsWith("image/")&&p.imageinfo?.[0]?.thumburl)||pages.find(p=>p.imageinfo?.[0]?.mime?.startsWith("image/"));
    const u=hit?.imageinfo?.[0]?.thumburl||hit?.imageinfo?.[0]?.url;
    if(u){imgCache[f.n]=u;save("food_image_cache_v1",imgCache);return u}
  }catch(e){}
  return "";
}

function cartoonIcon(f){
  const n=f.n||"美食";
  if(/奶茶|奶绿|拿铁/.test(n)) return "🧋";
  if(/蛋糕|蛋挞|泡芙|千层|布丁|冰淇淋|提拉米苏|双皮奶|杨枝甘露|芋圆/.test(n)) return "🍰";
  if(/火锅/.test(n)) return "🍲";
  if(/小龙虾|龙虾|生蚝|皮皮虾|螃蟹|大闸蟹|虾|鱼|鱿鱼|扇贝|花甲|海鲜/.test(n)) return "🦐";
  if(/烧烤|烤|串|炸串/.test(n)) return "🍢";
  if(/面|粉|米线/.test(n)) return "🍜";
  if(/饭|煲仔/.test(n)) return "🍚";
  if(/饺|包|烧麦|锅贴|肠粉|饭团|煎饼|灌饼|手抓饼/.test(n)) return "🥟";
  if(/鸡|鸭/.test(n)) return /鸭/.test(n)?"🦆":"🍗";
  if(/牛|羊|猪|肉|排骨|狮子头/.test(n)) return "🥩";
  if(/豆浆|油条|早餐|粥|鸡蛋|胡辣汤/.test(n)) return "🥞";
  if(/果汁|气泡|茶|饮|酸梅汤|柠檬/.test(n)) return "🥤";
  return "🍽️";
}
function cartoonBox(f,kind){
  const cls=kind==="result"?"resultPhoto":kind==="mini"?"miniPhoto":kind==="row"?"rowPhoto":"itemPhoto";
  const icon=cartoonIcon(f);
  const palette=["#FFE3D4","#DDF3FF","#FFF0B8","#E7E1FF","#DDF7E7"];
  const bg=palette[Math.abs(String(f.id||f.n).split("").reduce((a,c)=>a+c.charCodeAt(0),0))%palette.length];
  const svg="<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 420' role='img' aria-label='"+esc(f.n)+"'><defs><linearGradient id='g' x1='0' x2='1' y1='0' y2='1'><stop stop-color='"+bg+"'/><stop offset='1' stop-color='#fffaf6'/></linearGradient></defs><rect width='640' height='420' rx='34' fill='url(#g)'/><circle cx='82' cy='70' r='42' fill='#fff' opacity='.45'/><circle cx='560' cy='95' r='62' fill='#fff' opacity='.32'/><ellipse cx='320' cy='306' rx='190' ry='35' fill='#D7B9A7' opacity='.25'/><circle cx='320' cy='218' r='122' fill='#fff' stroke='#E5C7B6' stroke-width='7'/><text x='320' y='258' text-anchor='middle' font-size='128'>"+icon+"</text><text x='320' y='52' text-anchor='middle' font-family='sans-serif' font-size='25' font-weight='700' fill='#76564b'>"+esc(f.n)+"</text><path d='M190 338 Q320 370 450 338' fill='none' stroke='#E99A7B' stroke-width='7' stroke-linecap='round'/></svg>";
  return "<div class='"+cls+" cartoonFood' data-cartoon='1'>"+svg+"</div>";
}
function photoBox(f,kind){ return cartoonBox(f,kind); }
async function hydrate(container,foods){
  if(!container)return;
  await Promise.all(foods.map(async f=>{
    const el=container.querySelector("[data-img-id='"+encodeURIComponent(f.id)+"']");
    if(!el||el.querySelector("img"))return;
    const u=await commonsImage(f);
    if(u){el.innerHTML="<img src='"+esc(u)+"' alt='"+esc(f.n)+"' loading='lazy'>"}
  }))
}

  document.querySelectorAll("[data-upload]").forEach(inp=>inp.onchange=e=>uploadFoodImage(inp.dataset.upload,e.target));
  $("foodCat").innerHTML=activeCats().map(c=>"<option>"+esc(c)+"</option>").join("");
  $("catManager").innerHTML=activeCats().map((c,i)=>"<div class='catRow'><span>"+(catIcon[c]||"🍽️")+" "+esc(c)+" · "+activeFoods().filter(f=>f.cat===c).length+"道</span><button onclick='renameCat("+i+")' type='button'>改名</button><button onclick='deleteCat("+i+")' type='button'>删除</button></div>").join("");
  hydrate($("details"),show);
  renderRecords();
}

function saveActive(){save(source==="system"?"food_system_v6":"food_custom_v4",activeFoods())}
function saveCats(){save(source==="system"?"food_system_cats_v6":"food_custom_cats_v4",activeCats())}
window.renameCat=function(i){const cats=activeCats(),old=cats[i],n=prompt("把“"+old+"”改成：",old);if(!n||!n.trim()||n.trim()===old)return;const nn=n.trim();if(cats.includes(nn))return alert("这个分类已经存在");cats[i]=nn;activeFoods().forEach(f=>{if(f.cat===old)f.cat=nn});saveCats();saveActive();category=nn;render()};
window.deleteCat=function(i){const cats=activeCats();if(cats.length<=1)return alert("至少保留一个分类");const old=cats[i],target=cats[i===0?1:0];if(!confirm("删除“"+old+"”？该分类菜品会移到“"+target+"”。"))return;activeFoods().forEach(f=>{if(f.cat===old)f.cat=target});cats.splice(i,1);saveCats();saveActive();category="全部";render()};
function editFood(id){const f=activeFoods().find(x=>x.id===id);if(!f)return;const n=prompt("修改菜品名称：",f.n);if(!n||!n.trim())return;f.n=n.trim();saveActive();render()}
function deleteFood(id){const arr=activeFoods(),f=arr.find(x=>x.id===id);if(!f)return;if(confirm("确定删除“"+f.n+"”？")){if(source==="system")systemFoods=systemFoods.filter(x=>x.id!==id);else customFoods=customFoods.filter(x=>x.id!==id);saveActive();render()}}
function uploadFoodImage(id,input){const file=input.files?.[0];if(!file)return;const f=activeFoods().find(x=>x.id===id);if(!f)return;const rd=new FileReader();rd.onload=()=>{f.img=rd.result;delete imgCache[f.n];saveActive();render()};rd.readAsDataURL(file)}
function addCategory(){const n=$("newCat").value.trim();if(!n)return;if(activeCats().includes(n))return alert("分类已经存在");activeCats().push(n);$("newCat").value="";saveCats();render()}
function addFood(){const n=$("foodName").value.trim(),c=$("foodCat").value;if(!n)return alert("请输入菜品名称");const file=$("foodFile").files[0];const f={id:(source==="system"?"s":"c")+Date.now(),n,cat:c,e:"🍽️",region:source==="system"?"自定义系统菜品":"我的菜单"};const done=()=>{if(source==="system")systemFoods.push(f);else customFoods.push(f);saveActive();$("foodName").value="";$("foodFile").value="";render()};if(file){const rd=new FileReader();rd.onload=()=>{f.img=rd.result;done()};rd.readAsDataURL(file)}else done()}

async function showResult(f){
  current=f;const s=score(f);
  $("resultCat").textContent=(catIcon[f.cat]||"🍽️")+" "+f.cat;$("resultName").textContent=f.n;
  $("resultDesc").textContent=f.n+"，这是一道"+f.cat+"美食，适合"+(f.region&&f.region!=="全国"?f.region+"风味":"今晚")+"想吃这一口的时候直接决定。";
  $("recommend").textContent=s.r+"/5";$("taste").textContent=s.t+"/5";$("resultRegion").textContent="📍 "+(f.region||"我的菜单")+" · "+f.cat;
  $("resultPhoto").innerHTML=photoBox(f,"result");$("result").classList.add("show");
  celebrate();
}

let musicMode="food",audioCtx=null,musicTimer=null,userAudio=null,musicOn=false;
function tone(freq,dur,type="sine",gain=.014){
  if(!audioCtx||!musicOn)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(gain,audioCtx.currentTime+.05);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);
  o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur+.05);
}
function startMusic(mode=musicMode){
  musicMode=mode;if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume();
  if(userAudio){userAudio.pause();userAudio=null}musicOn=true;$("musicBtn").classList.add("on");$("musicBtn").textContent="♫";clearInterval(musicTimer);
  const p={warm:[392,440,523,587,659,587,523,440],happy:[523,587,659,784,880,784,659,587],food:[330,392,440,523,587,523,440,392]}[musicMode]||[330,392,440,523,587,523,440,392];
  let i=0;musicTimer=setInterval(()=>{const n=p[i++%p.length];tone(n,.42,"sine",.014);if(i%4===0)tone(n/2,.7,"triangle",.007)},520);
}
function drawSound(){if(!audioCtx||!musicOn)return;[523,659,784].forEach((n,i)=>setTimeout(()=>tone(n,.11,"triangle"),i*70))}
function winSound(){if(!audioCtx||!musicOn)return;[659,784,988,1318].forEach((n,i)=>setTimeout(()=>tone(n,.13),i*70))}
function celebrate(){winSound();for(let i=0;i<28;i++){const e=document.createElement("i");e.className="confetti";e.style.left=(10+Math.random()*80)+"vw";e.style.setProperty("--x",(Math.random()*180-90)+"px");e.style.animationDelay=(Math.random()*.3)+"s";document.body.appendChild(e);setTimeout(()=>e.remove(),2100)}for(let i=0;i<14;i++){const e=document.createElement("i");e.className="fire";e.style.setProperty("--x",(Math.random()*280-140)+"px");e.style.setProperty("--y",(Math.random()*240-120)+"px");document.body.appendChild(e);setTimeout(()=>e.remove(),1000)}}

function draw(){
  const a=list();if(!a.length)return alert("当前分类还没有菜品");
  const winner=a[Math.floor(Math.random()*a.length)],seq=[];for(let i=0;i<13;i++)seq.push(a[Math.floor(Math.random()*a.length)]);seq[11]=winner;
  $("draw").classList.add("show");$("result").classList.remove("show");$("drawTitle").textContent="正在抽取……";
  $("track").innerHTML=seq.map(f=>"<div class='mini'>"+photoBox(f,"mini")+"<b>"+esc(f.n)+"</b></div>").join("");
  const tr=$("track");tr.style.transition="none";tr.style.transform="translateX(0)";drawSound();
  requestAnimationFrame(()=>{tr.style.transition="transform 2.5s cubic-bezier(.1,.8,.15,1)";tr.style.transform="translateX(-"+(11*133-66)+"px)"});
  setTimeout(()=>{$("drawTitle").textContent="✨ 决定好了！";showResult(winner);history.push({...winner});history=history.slice(-30);save("food_hist_v5",history);renderRecords()},2650);
  hydrate($("track"),seq);
}

function renderRecords(){
  const arr=recordMode==="fav"?favorites:history;
  $("favTab").classList.toggle("on",recordMode==="fav");$("histTab").classList.toggle("on",recordMode==="hist");
  $("records").innerHTML=arr.length?arr.slice().reverse().map((f,i)=>"<div class='row'>"+photoBox(f,"row")+"<div class='rowMain'><b>"+esc(f.n)+"</b><small>"+esc(f.cat)+" · "+esc(f.region||"我的菜单")+"</small></div><button data-remove='"+esc(f.n)+"'>删除</button></div>").join(""):"<div class='empty'>这里还没有内容</div>";
  document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>removeRecord(b.dataset.remove));
  hydrate($("records"),arr.slice().reverse());
}
function removeRecord(name){if(recordMode==="fav"){favorites=favorites.filter(f=>f.n!==name);save("food_fav_v5",favorites)}else{const idx=history.findIndex(f=>f.n===name);if(idx>=0)history.splice(idx,1);save("food_hist_v5",history)}renderRecords()}
function clearRecords(){if(!confirm("确定清空当前列表？"))return;if(recordMode==="fav"){favorites=[];save("food_fav_v5",favorites)}else{history=[];save("food_hist_v5",history)}renderRecords()}

document.querySelectorAll(".mood").forEach(b=>b.onclick=()=>{document.querySelectorAll(".mood").forEach(x=>x.classList.remove("on"));b.classList.add("on")});
document.querySelectorAll(".source").forEach(b=>b.onclick=()=>{source=b.dataset.source;category="全部";render()});
$("managerToggle").onclick=()=>{$("managerBox").classList.toggle("show")};
$("start").onclick=draw;$("again").onclick=draw;$("addFood").onclick=addFood;$("addCat").onclick=addCategory;
$("like").onclick=()=>{if(!current)return;if(!favorites.some(x=>x.n===current.n)){favorites.push({...current});save("food_fav_v5",favorites)}$("like").textContent="💖 已收藏";renderRecords()};
$("favTab").onclick=()=>{recordMode="fav";renderRecords()};$("histTab").onclick=()=>{recordMode="hist";renderRecords()};$("clearRecords").onclick=clearRecords;
$("share").onclick=async()=>{const text=current?"今晚吃： "+current.n+" 🍽️":"吃点啥？";try{if(navigator.share)await navigator.share({title:"吃点啥？",text});else{await navigator.clipboard.writeText(text);alert("已复制结果，可以发给朋友")} }catch(e){}};
$("musicBtn").onclick=()=>$("musicPanel").classList.toggle("show");
document.querySelectorAll("[data-mood]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-mood]").forEach(x=>x.classList.remove("on"));b.classList.add("on");startMusic(b.dataset.mood)});
$("musicFile").onchange=e=>{const f=e.target.files?.[0];if(!f)return;if(!userAudio)userAudio=new Audio();userAudio.src=URL.createObjectURL(f);userAudio.loop=true;userAudio.volume=.42;userAudio.play().then(()=>{$("musicBtn").classList.add("on");$("musicBtn").textContent="♫";$("musicPanel").classList.remove("show")}).catch(()=>alert("请先点击右上角音乐圆圈，再选择音乐"))};

try{render();renderRecords()}catch(e){console.error(e);$("details").innerHTML="<div class='empty' style='grid-column:1/-1'>正在恢复数据，请刷新一次页面。</div>"}
</script>
</body>
</html>
