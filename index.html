<style>

<body>
<canvas id="fx"></canvas>
<div class="wrap">
<div class="top"><div class="brand">🍽️ 今天吃什么<small>你的专属吃饭决策器</small></div><button class="music" id="music">🔊 音乐开</button></div>
<header><h1>今晚不知道吃什么？</h1><div class="sub">预算、人数、口味先告诉我，再让转盘替你做决定。</div></header>

<section class="card">
<div class="choices">
<div class="choice"><label>💰 预算</label><select id="budget"><option value="20">¥20以内</option><option value="50" selected>¥50左右</option><option value="100">¥100+</option></select></div>
<div class="choice"><label>👥 人数</label><select id="people"><option value="one">一个人</option><option value="two">两个人</option><option value="group">聚餐</option></select></div>
<div class="choice"><label>🍽️ 范围</label><select id="scope"><option value="all">全部美食</option><option value="正餐">正餐</option><option value="面粉">面/粉</option><option value="火锅">火锅</option><option value="烧烤">烧烤</option><option value="小吃">小吃</option><option value="甜品">甜品</option><option value="饮品">饮品</option></select></div>
</div>
<div class="tastes" id="tastes">
<button class="taste on" data-t="all">✨ 随便都行</button><button class="taste" data-t="辣">🌶️ 想吃辣</button><button class="taste" data-t="肉">🥩 想吃肉</button><button class="taste" data-t="清爽">🥗 清爽</button><button class="taste" data-t="甜">🍰 想吃甜</button><button class="taste" data-t="饮品">🧋 想喝点</button>
</div>
<div class="stage"><div class="glow"></div><div class="pointer"></div><div class="shell"><canvas id="wheel" width="900" height="900"></canvas><div class="center">🍴</div></div></div>
<button class="spin" id="spin">🎰 开始随机决策</button><div class="musicHint">第一次点击后开启背景音乐；浏览器会要求用户主动点击后才能播放声音，这是正常的自动播放限制。citeturn0search0</div>
</section>

<section class="result" id="result"><div class="resultArt"><img id="rImg" alt=""></div><h2 id="rName"></h2><div class="meta" id="rMeta"></div><div class="reason" id="rReason"></div><button class="again" id="again">不吃这个 · 再来一次</button></section>

<section class="card">
<div style="font-weight:950;margin-bottom:10px">➕ 自定义添加美食</div>
<div class="manage"><input id="newFood" placeholder="例如：大盘鸡、酸菜鱼、烤冷面…"><button class="add" id="add">加入转盘</button></div>
<div class="tags" id="tags"></div>
<div class="stats"><div class="stat"><b id="foodCount">0</b><span>转盘美食</span></div><div class="stat"><b id="todayCount">0</b><span>今日决策</span></div><div class="stat"><b id="turnCount">0</b><span>累计转盘</span></div></div>
</section>
<div class="footer">本地保存自定义美食与记录 · 无需注册 · 手机打开即可使用</div>
</div>

<script>

["肉夹馍","🥙","小吃","肉一个人"],["煎饼果子","🥞","小吃","一个人"],["生煎包","🥟","小吃","一个人"],["锅贴","🥟","小吃","一个人"],["臭豆腐","🧈","小吃","辣"],["葱油饼","🥞","小吃","一个人"],["手抓饼","🥞","小吃","肉一个人"],["鸭血粉丝汤","🍲","小吃","清爽一个人"],["羊肉泡馍","🍲","小吃","肉"],["炸串","🍢","小吃","辣"],["章鱼小丸子","🐙","小吃","一个人"],

["寿司","🍣","异国","清爽两个人"],["日式拉面","🍜","异国","肉一个人"],["韩式炸鸡","🍗","异国","肉辣多人"],["部队锅","🍲","异国","辣多人"],["意大利面","🍝","异国","肉两个人"],["牛排","🥩","异国","肉两个人"],["墨西哥卷饼","🌯","异国","辣肉"],["冬阴功","🍲","异国","辣清爽多人"],
["小龙虾","🦞","夜宵","辣肉多人"],["烧烤+啤酒","🍻","夜宵","辣肉多人"],["炒粉","🍜","夜宵","辣一个人"],["炒饭","🍳","夜宵","一个人"],["烤串","🍢","夜宵","辣肉多人"]
];
let foods=JSON.parse(localStorage.getItem("custom_foods_final")||"null")||BASE.map(x=>({n:x[0],e:x[1],c:x[2],t:x[3],custom:false}));
const key=f=>f.n, budget=document.getElementById("budget"),people=document.getElementById("people"),scope=document.getElementById("scope"),spin=document.getElementById("spin"),wheel=document.getElementById("wheel"),ctx=wheel.getContext("2d"),result=document.getElementById("result"),rImg=document.getElementById("rImg"),rName=document.getElementById("rName"),rMeta=document.getElementById("rMeta"),rReason=document.getElementById("rReason");
let taste="all",rot=0,busy=false,turns=+localStorage.getItem("final_turns")||0,today=JSON.parse(localStorage.getItem("final_today")||"[]");

function art(f){const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));const palettes={火锅:["#ffb39a","#d94732"],面粉:["#ffe0a6","#c77c32"],烧烤:["#ffc08f","#ad542f"],饮品:["#c8e7ff","#527eb7"],甜品:["#ffd1e2","#c75d92"],快餐:["#ffe18e","#c98a21"],异国:["#d8cef8","#7252a6"],夜宵:["#c8b5a8","#60483d"],正餐:["#f0d1a7","#a9673e"],小吃:["#ffd0aa","#bd6944"]};const p=palettes[f.c]||palettes.正餐;const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="'+p[0]+'"/><stop offset="1" stop-color="#fff"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-opacity=".16"/></filter></defs><rect width="1000" height="620" rx="48" fill="url(#g)"/><circle cx="120" cy="100" r="95" fill="#fff" opacity=".22"/><circle cx="890" cy="500" r="150" fill="#fff" opacity=".16"/><ellipse cx="500" cy="450" rx="300" ry="62" fill="#000" opacity=".08"/><g filter="url(#s)"><ellipse cx="500" cy="410" rx="275" ry="105" fill="#fff"/><ellipse cx="500" cy="395" rx="235" ry="82" fill="'+p[1]+'" opacity=".9"/></g><text x="500" y="395" text-anchor="middle" font-size="190">'+esc(f.e)+'</text><rect x="270" y="495" width="460" height="70" rx="35" fill="#fff" opacity=".92"/><text x="500" y="540" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="800" fill="#2b211d">'+esc(f.n)+'</text></svg>';return "data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(svg)}

function draw(){const n=foods.length,W=900,c=W/2,R=420,step=Math.PI*2/n;ctx.clearRect(0,0,W,W);ctx.save();ctx.translate(c,c);ctx.rotate(rot);const colors=["#ffb39a","#ffd37e","#a9d8c7","#b8c7f2","#e8b7d6","#f4c58c","#b8d8eb","#f0a7a7"];for(let i=0;i<n;i++){const a=-Math.PI/2+i*step;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,a,a+step);ctx.closePath();ctx.fillStyle=colors[i%colors.length];ctx.fill();ctx.strokeStyle="#ffffffaa";ctx.lineWidth=4;ctx.stroke();ctx.save();ctx.rotate(a+step/2);ctx.translate(R*.69,0);ctx.rotate(Math.PI/2);ctx.textAlign="center";ctx.fillStyle="#392720";ctx.font=n>18?"26px sans-serif":"32px sans-serif";ctx.fillText(foods[i].e,0,-9);ctx.font=n>18?"bold 19px sans-serif":"bold 23px sans-serif";ctx.fillText(foods[i].n.slice(0,7),0,23);ctx.restore()}ctx.restore();const g=ctx.createRadialGradient(310,250,10,450,450,430);g.addColorStop(0,"#fff8");g.addColorStop(.35,"#fff1");g.addColorStop(1,"#0000");ctx.fillStyle=g;ctx.beginPath();ctx.arc(c,c,R,0,Math.PI*2);ctx.fill()}

function renderTags(){document.getElementById("tags").innerHTML=foods.map((f,i)=>'<span class="tag">'+f.e+' '+f.n+(f.custom?'<b data-i="'+i+'">×</b>':'')+'</span>').join("");document.getElementById("foodCount").textContent=foods.length;document.getElementById("todayCount").textContent=today.length;document.getElementById("turnCount").textContent=turns;document.querySelectorAll(".tag b").forEach(b=>b.onclick=()=>{foods.splice(+b.dataset.i,1);localStorage.setItem("custom_foods_final",JSON.stringify(foods));draw();renderTags()})}

let audio=null,musicTimer=null;
function startMusic(){if(audio)return;try{audio=new (window.AudioContext||window.webkitAudioContext)();const master=audio.createGain();master.gain.value=.035;master.connect(audio.destination);const chords=[[261.63,329.63,392],[220,277.18,329.63],[246.94,311.13,369.99],[196,246.94,293.66]];let k=0;musicTimer=setInterval(()=>{if(!audio)return;const chord=chords[k++%chords.length];chord.forEach((hz,j)=>{const o=audio.createOscillator(),g=audio.createGain();o.type="sine";o.frequency.value=hz;g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.07,audio.currentTime+.15);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+2.8);o.connect(g);g.connect(master);o.start();o.stop(audio.currentTime+3)});},2800)}catch(e){}}
function tick(hz=300){if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type="triangle";o.frequency.value=hz;g.gain.value=.035;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.045)}
function winSound(){if(!audio)return;[523,659,784,1046].forEach((hz,i)=>setTimeout(()=>tick(hz),i*90))}

function fireworks(){const c=document.getElementById("fx"),x=c.getContext("2d");c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.scale(devicePixelRatio,devicePixelRatio);const ps=[];for(let i=0;i<90;i++){const a=Math.random()*Math.PI*2,s=2+Math.random()*6;ps.push({x:innerWidth*.5+(Math.random()-.5)*80,y:innerHeight*.38+(Math.random()-.5)*50,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,h:Math.random()*360})}const ribbons=[];for(let i=0;i<35;i++)ribbons.push({x:Math.random()*innerWidth,y:-20-Math.random()*100,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:Math.random()*6});let t=0;function frame(){x.clearRect(0,0,innerWidth,innerHeight);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.045;p.life-=.014;x.globalAlpha=Math.max(0,p.life);x.fillStyle="hsl("+p.h+",90%,60%)";x.beginPath();x.arc(p.x,p.y,3.2,0,7);x.fill()});ribbons.forEach(r=>{r.x+=r.vx;r.y+=r.vy;r.r+=.08;x.save();x.translate(r.x,r.y);x.rotate(r.r);x.globalAlpha=.8;x.fillStyle="hsl("+((r.r*80)%360)+",85%,62%)";x.fillRect(-3,-9,6,18);x.restore()});if(t++<110)requestAnimationFrame(frame);else x.clearRect(0,0,innerWidth,innerHeight)}frame()}

function eligible(){let a=foods.slice();if(scope.value!=="all")a=a.filter(f=>f.c===scope.value);if(taste!=="all")a=a.filter(f=>f.t.includes(taste));const b=+budget.value;if(b<=20)a=a.filter(f=>!["牛排","海鲜烧烤","潮汕牛肉火锅","小龙虾","韩式烤肉"].includes(f.n));if(people.value==="one")a=a.filter(f=>!["重庆火锅","韩式烤肉","海鲜烧烤","部队锅","小龙虾"].includes(f.n));if(people.value==="group")a=a.filter(f=>!["螺蛳粉","重庆小面","蛋挞","冰美式"].includes(f.n));return a.length?a:foods}
function decide(){if(busy)return;startMusic();const a=eligible();busy=true;spin.disabled=true;let idx=Math.floor(Math.random()*a.length),f=a[idx],fi=foods.indexOf(f),n=foods.length,step=Math.PI*2/n,target=-step*(fi+.5),delta=((target-rot)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)+(Math.PI*2)*(7+Math.floor(Math.random()*2)),start=rot,end=rot+delta,dur=6000+Math.random()*900,t0=performance.now(),last=-1;function frame(now){const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,4.4);rot=start+(end-start)*e;draw();const q=Math.floor((rot-start)/step);if(q!==last){last=q;tick(230+Math.min(600,q*13))}if(p<1)requestAnimationFrame(frame);else{rot=end;draw();turns++;today.push(key(f));today=today.slice(-30);localStorage.setItem("final_turns",turns);localStorage.setItem("final_today",JSON.stringify(today));rImg.src=art(f);rImg.alt=f.n;rName.textContent=f.e+" "+f.n;rMeta.textContent=f.c+" · "+(people.value==="one"?"适合一个人":people.value==="two"?"适合两个人":"适合聚餐")+" · 预算 ¥"+budget.value+"+";rReason.textContent="根据你的预算、人数和口味筛选后，随机决定今晚这一口。";result.classList.add("show");fireworks();winSound();if(navigator.vibrate)navigator.vibrate([30,60,30]);busy=false;spin.disabled=false;renderTags();result.scrollIntoView({behavior:"smooth",block:"center"})}}requestAnimationFrame(frame)}
document.querySelectorAll(".taste").forEach(b=>b.onclick=()=>{document.querySelectorAll(".taste").forEach(x=>x.classList.remove("on"));b.classList.add("on");taste=b.dataset.t});
spin.onclick=decide;document.getElementById("again").onclick=decide;
document.getElementById("add").onclick=()=>{const v=document.getElementById("newFood").value.trim();if(!v)return;foods.push({n:v,e:"🍽️",c:"自定义",t:"",custom:true});localStorage.setItem("custom_foods_final",JSON.stringify(foods));document.getElementById("newFood").value="";draw();renderTags();tick(660)};
document.getElementById("music").onclick=()=>{if(!audio){startMusic();document.getElementById("music").textContent="🔊 音乐开"}else{audio.close();audio=null;clearInterval(musicTimer);musicTimer=null;document.getElementById("music").textContent="🔇 音乐关"}};
draw();renderTags();
</script>
