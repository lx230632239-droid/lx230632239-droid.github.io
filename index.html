<style>

.cartoonFood svg{width:100%;height:100%;display:block}.miniPhoto.cartoonFood,.rowPhoto.cartoonFood{display:block}.placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#fff1e8,#f8e4d9);color:#a97865;font-weight:950;font-size:13px;text-align:center;padding:8px}

<body>
<main class="app">
  <div class="top"><div><div class="brand">🍽️ 吃点啥？</div><div class="sub">让今晚吃什么，不再纠结</div></div></div>
  <section class="hero"><div class="eyebrow">🎁 美食盲盒 · 最终版</div><h1>吃点啥？</h1><p>先筛选，再抽取；照片、收藏、记录、菜单管理各自归位。</p></section>

  <section class="card controls">
    <div class="moods"><button class="pill on mood">🎲 随便吃</button><button class="pill mood">🌶️ 想吃辣</button><button class="pill mood">🥩 想吃肉</button><button class="pill mood">🍰 想吃甜</button><button class="pill mood">🧋 想喝点</button></div>
    <div class="filters">
      <div class="field"><label>预算</label><select id="budget"><option>¥20以内</option><option selected>¥20–50</option><option>¥50–100</option><option>¥100+</option></select></div>
      <div class="field"><label>人数</label><select id="people"><option>单人</option><option selected>双人</option><option>三到五人</option><option>六到八人</option><option>团建</option></select></div>
      <div class="field"><label>口味</label><select id="tasteFilter"><option>随便</option><option>清淡</option><option>重口</option><option>酸辣</option><option>甜口</option></select></div>
    </div>

    <div class="menu" id="menuBox">
      <button class="menuToggle" id="menuToggle" type="button" aria-expanded="true"><span>🍽️ 美食品类 <em id="menuState">收起</em></span><span class="menuChevron" id="menuChevron">⌃</span></button>
      <div class="menuBody">
      <div class="sources"><button class="pill source on" data-source="system">系统菜单 <span id="systemCount"></span></button><button class="pill source" data-source="custom">我的菜单 <span id="customCount"></span></button></div>
      <div class="label" style="margin-top:11px">🍽️ 分类</div>
      <div class="cats" id="cats"></div>
      <div class="count" id="count"></div>
      <div class="details" id="details"></div>
      </div>
      <button class="managerToggle" id="managerToggle" type="button">⚙️ 菜单管理 <span style="float:right">点击展开 / 收起</span></button>
      <div class="managerBox" id="managerBox">
        <div class="label">✍️ 当前菜单管理</div>
        <div class="managerGrid">
          <input id="foodName" placeholder="输入菜品名称">
          <select id="foodCat"></select>
          <input id="foodFile" class="wide" type="file" accept="image/*">
          <button id="addFood" type="button">＋添加菜品</button>
        </div>
        <div class="uploadTip">📷 可从手机相册给菜品上传真实照片；上传后优先使用你的照片。系统菜品统一使用清爽的动漫卡通美食图；你也可以给自己的菜品上传照片。</div>
        <div class="label" style="margin-top:10px">🗂️ 分类管理</div>
        <div class="managerGrid"><input id="newCat" placeholder="例如：我最爱吃"><button id="addCat" type="button">＋新增分类</button></div>
        <div id="catManager"></div>
      </div>
      </div>
    </div>
    <div class="aiDecide"><div class="aiDecideHead"><b>✨ AI 帮我决定</b><span>把你的真实需求告诉 AI</span></div><div class="aiInputRow"><input id="aiRequest" placeholder="例如：两个人，50元以内，别太辣，想吃饱一点"><button id="aiDecideBtn" type="button">AI 决定</button></div><div class="aiAnswer" id="aiAnswer"></div></div>
    <button class="start" id="start" type="button">🎁 开始抽美食<small>中文菜名 · 对应图片 · 抽到什么吃什么</small></button>
  </section>

  <section class="card draw" id="draw"><div class="drawTitle" id="drawTitle">正在抽取……</div><div class="trackBox"><div class="track" id="track"></div></div></section>

  <section class="card result" id="result">
    <div class="resultPhoto" id="resultPhoto"><div class="photoLoading">正在调取对应美食照片…</div></div>
    <div class="info">
      <div class="tag" id="resultCat"></div><div class="name" id="resultName"></div><div class="aiState" id="aiState">AI 美食资料已生成</div><p class="desc" id="resultDesc"></p>
      <div class="scoreBox"><div class="score"><strong id="recommend"></strong><span>推荐指数</span></div><div class="score"><strong id="taste"></strong><span>口味评分</span></div></div>
      <div class="region" id="resultRegion"></div>
      <div class="actions"><button class="again" id="again">🎲 再抽</button><button class="like" id="like">❤️ 收藏</button><button class="share" id="share">📤 分享</button></div>
    </div>
  </section>

  <section class="card records">
    <div class="recordTabs"><button id="favTab" class="on">❤️ 收藏</button><button id="histTab">🕘 抽取记录</button></div>
    <div class="recordTools"><button id="clearRecords">清空当前列表</button></div>
    <div id="records"></div>
  </section>
</main>

<button class="musicBtn" id="musicBtn" aria-label="音乐设置">🎵</button>
<div class="musicPanel" id="musicPanel">
  <h4>🎵 AI 联网选歌</h4>
  <div class="musicModes"><button data-mood="warm">温馨</button><button data-mood="happy">欢快</button><button data-mood="food">食欲</button></div>
  <div class="musicSearch"><input id="musicSearch" placeholder="搜歌名 / 歌手 / 氛围"><button id="musicSearchBtn" type="button">搜索</button></div>
  <div class="musicResults" id="musicResults"></div>
  <label class="musicUpload">📁 播放手机本地音乐<input id="musicFile" type="file" accept="audio/*"></label>
  <div class="musicHint">在线歌曲使用公开试听片段；完整歌曲可打开官方音乐页面。</div>
  <audio id="musicAudio" preload="none"></audio>
</div><label class="musicUpload">📁 添加手机音乐<input id="musicFile" type="file" accept="audio/*"></label>
  <div class="musicHint">右上角圆圈只负责展开/收起，不再占页面空间。你也可以直接选手机里的音乐。</div>
</div>

<script>
const AI_API="https://restless-field-1986.lx230632239.workers.dev/food";
let aiSeq=0;
async function aiFood(f){
  const seq=++aiSeq;
  const state=$("aiState");
  if(state){state.textContent="AI 正在整理这道美食…";state.style.opacity=".65"}
  const payload={name:f.n,category:f.cat,region:f.region||"",tasteFilter:$("tasteFilter")?.value||"随便",budget:$("budget")?.value||"",people:$("people")?.value||""};
  try{
    const res=await fetch(AI_API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    const data=await res.json();
    if(!res.ok||!data.ok)throw new Error(data.error||"AI请求失败");
    if(seq!==aiSeq)return;
    if(data.region)f.region=data.region;
    if(data.story)$("resultRegion").innerHTML="📍 <b>地点：</b>"+esc(data.region||f.region||"中国")+"<br>📖 <b>故事：</b>"+esc(data.story)+"<br>🍴 <b>点评：</b>"+esc(data.taste||data.desc||tastyDesc(f));
    if(data.desc)$("resultDesc").textContent=data.desc;
    if(data.recommend)$("recommend").textContent=data.recommend+"/5";
    if(data.tasteScore)$("taste").textContent=data.tasteScore+"/5";
    const tag=$("resultCat"); if(tag&&!tag.textContent.includes("AI"))tag.textContent+=" · AI";
    if(state){state.textContent="AI 美食资料已生成";state.style.opacity="1"}
  }catch(e){
    if(state){state.textContent="已使用本地美食资料";state.style.opacity="1"}
    console.warn("AI food:",e);
  }
}

async function commonsImage(f){
  if(f.img)return f.img;
  if(imgCache[f.n])return imgCache[f.n];
  const q=queryMap[f.n]||f.n+" food";
  const url="https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch="+encodeURIComponent(q)+"&gsrnamespace=6&gsrlimit=8&prop=imageinfo&iiprop=url|mime&iiurlwidth=700&format=json&origin=*";
  try{
    const r=await fetch(url);const j=await r.json();const pages=Object.values(j.query?.pages||{});
    const hit=pages.find(p=>p.imageinfo?.[0]?.mime?.startsWith("image/")&&p.imageinfo?.[0]?.thumburl)||pages.find(p=>p.imageinfo?.[0]?.mime?.startsWith("image/"));
    const u=hit?.imageinfo?.[0]?.thumburl||hit?.imageinfo?.[0]?.url;
    if(u){imgCache[f.n]=u;save("food_image_cache_v1",imgCache);return u}
  }catch(e){}
  return "";
}

async function fetchRealFoodImage(f,node){
  if(!f||f.img||!node||node.dataset.realLoaded==="1")return;
  const key=f.id+"|"+f.n, cached=imgCache[key];
  if(cached){node.innerHTML="<img src='"+esc(cached)+"' alt='"+esc(f.n)+"' loading='lazy'>";node.dataset.realLoaded="1";return;}
  const q=queryMap[f.n]||f.n;
  try{
    const url="https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch="+encodeURIComponent(q+" food")+"&gsrnamespace=6&gsrlimit=12&prop=imageinfo&iiprop=url|mime&iiurlwidth=1000&format=json&origin=*";
    const data=await (await fetch(url)).json();
    const pages=Object.values(data.query?.pages||{});
    const tokens=q.toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff]+/g," ").trim().split(/\s+/).filter(x=>x.length>1);
    const scored=pages.map(p=>{
      const title=(p.title||"").replace(/^File:/i,"").toLowerCase();
      const info=p.imageinfo?.[0];
      if(!info?.mime?.startsWith("image/")||!info.url)return null;
      let score=0;
      if(tokens.length) score=tokens.reduce((n,t)=>n+(title.includes(t)?1:0),0)/tokens.length;
      if(title.includes(f.n.toLowerCase()))score+=1;
      if(/logo|icon|map|poster|diagram|menu|packaging|label|screenshot/i.test(title))score-=2;
      return {score,url:info.thumburl||info.url};
    }).filter(Boolean).sort((a,b)=>b.score-a.score);
    const hit=scored[0];
    if(hit&&hit.score>=0.75){
      imgCache[key]=hit.url;save("food_image_cache_v2",imgCache);
      node.innerHTML="<img src='"+esc(hit.url)+"' alt='"+esc(f.n)+"' loading='lazy' referrerpolicy='no-referrer'>";
      node.dataset.realLoaded="1";
    }
  }catch(e){}
}
async function hydrate(){
  const nodes=document.querySelectorAll("[data-food-id]");
  for(const node of nodes){
    const f=systemFoods.find(x=>x.id===node.dataset.foodId)||customFoods.find(x=>x.id===node.dataset.foodId);
    if(f&&!f.img)await fetchRealFoodImage(f,node);
  }
}

function playSong(s){if(!s?.preview)return;if(userAudio){userAudio.pause();userAudio=null}if(!musicAudio)musicAudio=$("musicAudio");musicAudio.src=s.preview;musicAudio.loop=true;musicAudio.volume=.42;musicAudio.play().then(()=>setMusicOn(true)).catch(()=>{});}
function startMusic(mode=musicMode){musicMode=mode;searchMusic(moodQueries[mode]||moodQueries.food,true);}
function celebrate(){winSound();for(let i=0;i<28;i++){const e=document.createElement("i");e.className="confetti";e.style.left=(10+Math.random()*80)+"vw";e.style.setProperty("--x",(Math.random()*180-90)+"px");e.style.animationDelay=(Math.random()*.3)+"s";document.body.appendChild(e);setTimeout(()=>e.remove(),2100)}for(let i=0;i<14;i++){const e=document.createElement("i");e.className="fire";e.style.setProperty("--x",(Math.random()*280-140)+"px");e.style.setProperty("--y",(Math.random()*240-120)+"px");document.body.appendChild(e);setTimeout(()=>e.remove(),1000)}}

function draw(){
  const a=list();if(!a.length)return alert("当前分类还没有菜品");
  const winner=a[Math.floor(Math.random()*a.length)],seq=[];for(let i=0;i<13;i++)seq.push(a[Math.floor(Math.random()*a.length)]);seq[11]=winner;
  $("draw").classList.add("show");$("result").classList.remove("show");$("drawTitle").textContent="正在抽取……";
  $("track").innerHTML=seq.map(f=>"<div class='mini'>"+photoBox(f,"mini")+"<b>"+esc(f.n)+"</b></div>").join("");
  const tr=$("track");tr.style.transition="none";tr.style.transform="translateX(0)";drawSound();
  requestAnimationFrame(()=>{tr.style.transition="transform 2.5s cubic-bezier(.1,.8,.15,1)";tr.style.transform="translateX(-"+(11*133-66)+"px)"});
  setTimeout(()=>{$("drawTitle").textContent="✨ 决定好了！";showResult(winner);history.push({...winner});history=history.slice(-30);save("food_hist_v5",history);renderRecords()},2650);
  hydrate();
}

function renderRecords(){
  const arr=recordMode==="fav"?favorites:history;
  $("favTab").classList.toggle("on",recordMode==="fav");$("histTab").classList.toggle("on",recordMode==="hist");
  $("records").innerHTML=arr.length?arr.slice().reverse().map((f,i)=>"<div class='row'>"+photoBox(f,"row")+"<div class='rowMain'><b>"+esc(f.n)+"</b><small>"+esc(f.cat)+" · "+esc(f.region||"我的菜单")+"</small></div><button data-remove='"+esc(f.n)+"'>删除</button></div>").join(""):"<div class='empty'>这里还没有内容</div>";
  document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>removeRecord(b.dataset.remove));
  hydrate();
}
function removeRecord(name){if(recordMode==="fav"){favorites=favorites.filter(f=>f.n!==name);save("food_fav_v5",favorites)}else{const idx=history.findIndex(f=>f.n===name);if(idx>=0)history.splice(idx,1);save("food_hist_v5",history)}renderRecords()}
function clearRecords(){if(!confirm("确定清空当前列表？"))return;if(recordMode==="fav"){favorites=[];save("food_fav_v5",favorites)}else{history=[];save("food_hist_v5",history)}renderRecords()}

async function aiDecide(){const box=$("aiAnswer"),btn=$("aiDecideBtn"),input=$("aiRequest"),a=list();if(!a.length)return alert("当前分类没有可供AI选择的菜品");btn.disabled=true;btn.textContent="分析中…";box.classList.add("show");box.innerHTML="✨ AI 正在根据预算、人数、口味和你的要求筛选…";try{const res=await fetch(AI_API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({mode:"decide",candidates:a,budget:$("budget").value,people:$("people").value,tasteFilter:$("tasteFilter").value,requestText:input.value.trim()})});const d=await res.json();if(!res.ok||!d.ok)throw new Error(d.error||"AI请求失败");const f=a.find(x=>x.n===d.winner)||a[0];box.innerHTML="<div class='aiWinner'>🍽️ "+esc(f.n)+"</div><div>"+esc(d.reason)+"</div><div class='aiAlt'>备选："+esc((d.alternatives||[]).join("、")||"暂无")+"</div><div class='aiTip'>💡 "+esc(d.orderTip)+"</div>";showResult(f);$("result").scrollIntoView({behavior:"smooth",block:"start"});}catch(e){box.innerHTML="AI暂时没能完成判断，你也可以直接点击“开始抽美食”。";console.warn(e)}finally{btn.disabled=false;btn.textContent="AI 决定"}}
document.querySelectorAll(".mood").forEach(b=>b.onclick=()=>{document.querySelectorAll(".mood").forEach(x=>x.classList.remove("on"));b.classList.add("on")});
document.querySelectorAll(".source").forEach(b=>b.onclick=()=>{source=b.dataset.source;category="全部";render()});
$("managerToggle").onclick=()=>{$("managerBox").classList.toggle("show")};
$("menuToggle").onclick=()=>{const m=$("menuBox"),open=!m.classList.contains("collapsed");m.classList.toggle("collapsed");$("menuState").textContent=open?"展开":"收起";$("menuToggle").setAttribute("aria-expanded",String(!open));};
$("start").onclick=draw;$("again").onclick=draw;$("aiDecideBtn").onclick=aiDecide;$("aiRequest").addEventListener("keydown",e=>{if(e.key==="Enter")aiDecide()});$("addFood").onclick=addFood;$("addCat").onclick=addCategory;
$("like").onclick=()=>{if(!current)return;if(!favorites.some(x=>x.n===current.n)){favorites.push({...current});save("food_fav_v5",favorites)}$("like").textContent="💖 已收藏";renderRecords()};
$("favTab").onclick=()=>{recordMode="fav";renderRecords()};$("histTab").onclick=()=>{recordMode="hist";renderRecords()};$("clearRecords").onclick=clearRecords;
$("share").onclick=async()=>{const text=current?"今晚吃： "+current.n+" 🍽️":"吃点啥？";try{if(navigator.share)await navigator.share({title:"吃点啥？",text});else{await navigator.clipboard.writeText(text);alert("已复制结果，可以发给朋友")} }catch(e){}};
$("musicBtn").onclick=()=>$("musicPanel").classList.toggle("show");
document.querySelectorAll("[data-mood]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-mood]").forEach(x=>x.classList.remove("on"));b.classList.add("on");startMusic(b.dataset.mood)});
$("musicSearchBtn").onclick=()=>searchMusic($("musicSearch").value.trim());
$("musicSearch").addEventListener("keydown",e=>{if(e.key==="Enter")searchMusic($("musicSearch").value.trim())});
$("musicFile").onchange=e=>{const f=e.target.files?.[0];if(!f)return;if(musicAudio)musicAudio.pause();userAudio=new Audio(URL.createObjectURL(f));userAudio.loop=true;userAudio.volume=.42;userAudio.play().then(()=>{setMusicOn(true);$("musicPanel").classList.remove("show")}).catch(()=>alert("请点击播放权限后重试"))};

try{render();renderRecords();$("menuBox").classList.remove("collapsed");$("menuState").textContent="收起";$("menuToggle").setAttribute("aria-expanded","true");$("managerBox").classList.remove("show")}catch(e){console.error(e);$("details").innerHTML="<div class='empty' style='grid-column:1/-1'>正在恢复数据，请刷新一次页面。</div>"}
</script>
</body>
</html>
