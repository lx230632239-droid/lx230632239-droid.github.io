const catIcon={主食:"🍚",正餐:"🍱",小吃:"🍢",甜品:"🍰",奶茶:"🧋",饮品:"🥤",烧烤:"🔥",火锅:"🍲",海鲜:"🦐",早餐:"🥟",夜宵:"🌙",家常菜:"🥘",我喜欢的:"❤️",聚餐:"🍽️",甜品饮品:"🍰"};
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function score(f){let h=0;for(const c of f.n)h+=c.charCodeAt(0);return {r:(4.3+(h%7)/10).toFixed(1),t:(4.2+(h%8)/10).toFixed(1)}}
function palette(cat){return {甜品:["#f6c4cf","#fff1f5"],奶茶:["#d8b28c","#fff4e7"],饮品:["#a8d6c6","#f0fbf7"],烧烤:["#e59a68","#fff0df"],火锅:["#df7661","#fff0ea"],海鲜:["#8ec8d2","#effbfc"],早餐:["#e3bd78","#fff6df"],夜宵:["#bb8a72","#fff0e9"],小吃:["#e5b46c","#fff4df"],主食:["#d4ad73","#fff5df"],正餐:["#d69a7a","#fff0e8"],家常菜:["#c7a679","#fff5e5"]}[cat]||["#d9b8a5","#fff2ea"]}
function art(f){const p=palette(f.cat),a=p[0],b=p[1],n=esc(f.n),name=f.n;let s="<ellipse cx='600' cy='470' rx='300' ry='100' fill='#fff' stroke='#d7c5bd' stroke-width='8'/><circle cx='500' cy='430' r='55' fill='"+a+"'/><circle cx='650' cy='430' r='55' fill='#e3a06d'/>";if(name.includes("串"))s="<line x1='330' y1='540' x2='870' y2='260' stroke='#9b6b47' stroke-width='14'/><circle cx='420' cy='495' r='48' fill='#a94f39'/><circle cx='550' cy='430' r='48' fill='#d47c4e'/><circle cx='680' cy='365' r='48' fill='#b85b3f'/><circle cx='810' cy='300' r='48' fill='#d99858'/>";else if(name.includes("关东煮"))s="<ellipse cx='600' cy='480' rx='300' ry='125' fill='#fff' stroke='#c8b3aa' stroke-width='8'/><ellipse cx='600' cy='450' rx='250' ry='90' fill='#d9ad72'/><rect x='465' y='350' width='45' height='165' rx='18' fill='#f2dfb8'/><rect x='570' y='330' width='48' height='185' rx='18' fill='#e7c58e'/><rect x='680' y='350' width='48' height='165' rx='18' fill='#d98b62'/>";else if(name.includes("奶茶")||name.includes("奶绿")||name.includes("波波")||name.includes("厚乳"))s="<rect x='455' y='185' width='290' height='360' rx='55' fill='#fff' stroke='#6b5147' stroke-width='8'/><path d='M480 330h240v170q-120 55-240 0z' fill='#c49a70'/><circle cx='525' cy='470' r='18' fill='#54382e'/><circle cx='600' cy='490' r='18' fill='#54382e'/><circle cx='675' cy='470' r='18' fill='#54382e'/><path d='M565 195L680 55' stroke='#6b5147' stroke-width='15'/>";else if(name.includes("火锅")||name.includes("锅"))s="<ellipse cx='600' cy='480' rx='315' ry='135' fill='#623b31'/><ellipse cx='600' cy='450' rx='270' ry='105' fill='"+a+"'/><circle cx='500' cy='435' r='38' fill='#e7a15f'/><circle cx='690' cy='425' r='40' fill='#86a975'/>";else if(name.includes("蛋糕")||name.includes("蛋挞")||name.includes("泡芙")||name.includes("千层")||name.includes("布丁")||name.includes("冰淇淋")||name.includes("圣代")||name.includes("派"))s="<path d='M390 360L810 360L735 535Q600 595 465 535Z' fill='#f1d09e' stroke='#c78d69' stroke-width='8'/><path d='M425 360q175-110 350 0' fill='none' stroke='#fff' stroke-width='50'/><circle cx='520' cy='325' r='38' fill='#e87580'/><circle cx='650' cy='315' r='34' fill='#8eb070'/>";else if(name.includes("面")||name.includes("粉")||name.includes("米线"))s="<ellipse cx='600' cy='475' rx='300' ry='105' fill='#fff' stroke='#d7c5bd' stroke-width='8'/><path d='M390 450q90-120 180 0t180 0t180 0' fill='none' stroke='#d39c68' stroke-width='28'/><path d='M410 420q90-100 180 0t180 0' fill='none' stroke='#f0c47b' stroke-width='18'/>";else if(name.includes("饭")||name.includes("炒饭")||name.includes("盖饭"))s="<ellipse cx='600' cy='475' rx='310' ry='105' fill='#fff' stroke='#d7c5bd' stroke-width='8'/><ellipse cx='600' cy='430' rx='190' ry='90' fill='#e9c884'/><circle cx='510' cy='420' r='32' fill='#fff0bd'/><circle cx='680' cy='430' r='35' fill='#78a26d'/>";else if(name.includes("鱼")||name.includes("虾")||name.includes("蟹")||name.includes("生蚝")||name.includes("扇贝")||name.includes("龙虾")||name.includes("鱿鱼")||name.includes("刺身")||name.includes("寿司"))s="<ellipse cx='600' cy='470' rx='310' ry='105' fill='#fff' stroke='#d7c5bd' stroke-width='8'/><path d='M380 455q140-150 300-20q110 90 240-35q-55 185-240 120q-175 80-300-65z' fill='#e47d68'/><circle cx='790' cy='390' r='42' fill='#f0c58b'/><circle cx='455' cy='420' r='28' fill='#91c4d0'/>";else if(name.includes("牛肉")||name.includes("羊肉")||name.includes("五花肉")||name.includes("排骨")||name.includes("鸡翅")||name.includes("炸鸡")||name.includes("叉烧")||name.includes("肘子")||name.includes("扣肉")||name.includes("猪蹄"))s="<ellipse cx='600' cy='475' rx='310' ry='105' fill='#fff' stroke='#d7c5bd' stroke-width='8'/><rect x='410' y='390' width='150' height='75' rx='25' fill='#9f4e39' transform='rotate(-12 485 425)'/><rect x='535' y='420' width='170' height='78' rx='25' fill='#c46b47' transform='rotate(7 620 460)'/><rect x='680' y='375' width='125' height='72' rx='24' fill='#8f4435' transform='rotate(-8 740 410)'/>";return "<div class='art'><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 700'><defs><linearGradient id='g"+f.id+"' x1='0' y1='0' x2='1' y2='1'><stop stop-color='"+a+"'/><stop offset='1' stop-color='"+b+"'/></linearGradient></defs><rect width='1200' height='700' fill='url(#g"+f.id+")'/><circle cx='1040' cy='90' r='180' fill='#fff7'/>"+s+"<text x='600' y='105' text-anchor='middle' font-size='50' font-family='sans-serif' font-weight='900' fill='#4b352c'>"+n+"</text><text x='600' y='650' text-anchor='middle' font-size='22' fill='#755f55'>"+esc(f.cat)+" · 美食插画</text></svg></div>"}
function photoTag(f){const n=f.n;const exact={"螺蛳粉":"luosifen,noodles","兰州牛肉面":"lanzhou,noodles,beef","重庆小面":"chongqing,noodles","热干面":"wuhan,noodles","炸酱面":"zhajiangmian,noodles","担担面":"dandan,noodles","宫保鸡丁":"kungpao,chicken,chinese-food","麻婆豆腐":"mapotofu,tofu,chinese-food","北京烤鸭":"peking-duck,duck","小笼包":"xiaolongbao,dumplings","生煎包":"dumplings","锅贴":"dumplings","肉夹馍":"roujiamo,chinese-food","关东煮":"oden,japanese-food","提拉米苏":"tiramisu,dessert","草莓蛋糕":"strawberry,cake,dessert","芒果千层":"mango,cake,dessert","黑糖珍珠奶茶":"bubble-tea,milk-tea","芋泥奶茶":"bubble-tea,milk-tea","抹茶奶茶":"matcha,milk-tea","重庆火锅":"chongqing,hotpot","潮汕牛肉火锅":"hotpot,beef","小龙虾":"crawfish,lobster,seafood","蒜蓉生蚝":"oysters,seafood","清蒸大闸蟹":"crab,seafood","豆浆油条":"soy-milk,fried-dough,breakfast","煎饼果子":"jianbing,breakfast"};if(exact[n])return exact[n];if(/奶茶|奶绿|拿铁/.test(n))return"bubble-tea,milk-tea";if(/火锅/.test(n))return"hotpot,chinese-food";if(/小龙虾|龙虾/.test(n))return"crawfish,lobster,seafood";if(/生蚝|扇贝|花甲|虾|蟹|鱿鱼|皮皮虾|海鲜/.test(n))return"seafood,shrimp";if(/串|烧烤|烤/.test(n))return"barbecue,grilled-food";if(/面|粉|米线/.test(n))return"noodles,chinese-food";if(/饭/.test(n))return"fried-rice,chinese-food";if(/饺|包|烧麦|锅贴|肠粉|饭团/.test(n))return"dumplings,dim-sum";if(/蛋糕|蛋挞|泡芙|千层|布丁|冰淇淋|提拉米苏|芋圆/.test(n))return"dessert,cake";if(/果汁|气泡|茶|饮/.test(n))return"drink,beverage";if(/鸡/.test(n))return"chicken,chinese-food";if(/牛/.test(n))return"beef,chinese-food";if(/羊/.test(n))return"lamb,barbecue";if(/鸭/.test(n))return"duck,chinese-food";if(/鱼/.test(n))return"fish,chinese-food";if(/肉|排骨|猪蹄/.test(n))return"pork,meat,chinese-food";return"chinese-food,food"}function photoUrl(f){const tag=photoTag(f);let h=0;for(const c of f.n)h=(h*31+c.charCodeAt(0))>>>0;return"https://loremflickr.com/640/420/"+tag+"?lock="+(h%997)}
function visual(f,small=false){const box=small?"miniVisual":"itemVisual";const fallback=art(f);return "<div class='"+box+"'><img src='"+(f.img||photoUrl(f))+"' alt='"+esc(f.n)+"' loading='lazy' onerror=\"this.onerror=null;this.style.display='none';this.nextElementSibling.style.display='block'\"><div class='photoFallback' style='display:none;width:100%;height:100%'>"+fallback+"</div></div>"}
function renderManager(){
  $("foodCat").innerHTML=activeCats().map(c=>"<option>"+esc(c)+"</option>").join("");
  $("catManager").innerHTML="<div class='catManager'>"+activeCats().map((c,i)=>"<div class='catRow'><span>"+(catIcon[c]||"🍽️")+" "+esc(c)+" · "+activeFoods().filter(f=>f.cat===c).length+"道</span><button type='button' onclick='renameCat("+i+")'>改名</button><button type='button' onclick='deleteCat("+i+")'>删除</button></div>").join("")+"</div>";
}
window.renameCat=function(i){const cats=activeCats(),old=cats[i],n=prompt("把“"+old+"”改成：",old);if(!n||!n.trim()||n.trim()===old)return;const nn=n.trim();if(cats.includes(nn))return alert("这个分类已经存在");cats[i]=nn;activeFoods().forEach(f=>{if(f.cat===old)f.cat=nn});save(source==="system"?"food_system_cats_v5":"food_custom_cats_v4",cats);save(source==="system"?"food_system_v5":"food_custom_v4",activeFoods());category=nn;render()};
window.deleteCat=function(i){const cats=activeCats();if(cats.length<=1)return alert("至少保留一个分类");const old=cats[i],target=cats[i===0?1:0];if(!confirm("删除“"+old+"”？该分类菜品会移到“"+target+"”。"))return;activeFoods().forEach(f=>{if(f.cat===old)f.cat=target});cats.splice(i,1);save(source==="system"?"food_system_cats_v5":"food_custom_cats_v4",cats);save(source==="system"?"food_system_v5":"food_custom_v4",activeFoods());category="全部";render()};
window.editFood=function(id){const arr=activeFoods(),f=arr.find(x=>x.id===id);if(!f)return;const n=prompt("修改菜品名称：",f.n);if(!n||!n.trim())return;f.n=n.trim();save(source==="system"?"food_system_v5":"food_custom_v4",arr);render()};
window.deleteFood=function(id){const arr=activeFoods(),f=arr.find(x=>x.id===id);if(f&&confirm("确定删除“"+f.n+"”？")){if(source==="system")systemFoods=arr.filter(x=>x.id!==id);else customFoods=arr.filter(x=>x.id!==id);save(source==="system"?"food_system_v5":"food_custom_v4",source==="system"?systemFoods:customFoods);render()}};
window.uploadFoodImage=function(id,input){const file=input.files&&input.files[0];if(!file)return;const arr=activeFoods(),f=arr.find(x=>x.id===id);if(!f)return;const rd=new FileReader();rd.onload=()=>{f.img=rd.result;save(source==="system"?"food_system_v5":"food_custom_v4",arr);render()};rd.readAsDataURL(file)};
function addCategory(){const n=$("newCat").value.trim();if(!n)return;const cats=activeCats();if(cats.includes(n))return alert("分类已经存在");cats.push(n);$("newCat").value="";save(source==="system"?"food_system_cats_v5":"food_custom_cats_v4",cats);render()}
function addFood(){const n=$("foodName").value.trim(),c=$("foodCat").value;if(!n)return alert("请输入菜品名称");const file=$("foodFile").files[0];const f={id:(source==="system"?"s":"c")+Date.now(),n,cat:c,e:"🍽️",region:source==="system"?"自定义系统菜品":"我的菜单"};const done=()=>{if(source==="system")systemFoods.push(f);else customFoods.push(f);save(source==="system"?"food_system_v5":"food_custom_v4",source==="system"?systemFoods:customFoods);$("foodName").value="";$("foodFile").value="";render()};if(file){const rd=new FileReader();rd.onload=()=>{f.img=rd.result;done()};rd.readAsDataURL(file)}else done()}
function showResult(f){current=f;const s=score(f);$("resultVisual").innerHTML=visual(f);$("resultCat").textContent=(catIcon[f.cat]||"🍽️")+" "+f.cat;$("resultName").textContent=f.n;$("resultDesc").textContent=f.n+"，这是一道"+f.cat+"美食，适合"+(f.region&&f.region!=="全国"?f.region+"风味":"今晚")+"想吃这一口的时候直接决定。";$("recommend").textContent=s.r+"/5";$("taste").textContent=s.t+"/5";$("resultRegion").textContent="📍 "+(f.region||"我的菜单")+" · "+f.cat;$("result").classList.add("show");celebrate()}
let musicMode="warm",userAudio=null;function playTone(freq,dur,type="sine",delay=0){if(!audioCtx||!musicOn)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.0001,audioCtx.currentTime+delay);g.gain.exponentialRampToValueAtTime(.035,audioCtx.currentTime+delay+.03);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+delay+dur);o.connect(g);g.connect(audioCtx.destination);o.start(audioCtx.currentTime+delay);o.stop(audioCtx.currentTime+delay+dur+.03)}function drawSound(){[523,659,784].forEach((f,i)=>playTone(f,.12,"triangle",i*.07))}function winSound(){[659,784,988,1318].forEach((f,i)=>playTone(f,.16,"sine",i*.07))}function startMusic(mode=musicMode){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume();if(userAudio){userAudio.pause();userAudio=null}musicOn=true;$("musicBtn").classList.add("on");$("musicBtn").textContent="♫";clearInterval(musicTimer);const patterns={warm:[262,330,392,523,392,330],happy:[392,440,523,659,784,659,523,440],food:[220,262,330,392,330,262,196,262]},tempo={warm:620,happy:320,food:430};let i=0;musicTimer=setInterval(()=>{const p=patterns[musicMode]||patterns.warm;const root=p[i++%p.length];playTone(root,.28,"triangle",0);if(musicMode==="warm")playTone(root*1.25,.18,"sine",.08);if(musicMode==="food")playTone(root*1.5,.16,"triangle",.06)},tempo[musicMode]||620)}function stopMusic(){musicOn=false;clearInterval(musicTimer);if(userAudio){userAudio.pause();userAudio=null}$("musicBtn").classList.remove("on");$("musicBtn").textContent="🎵"}
function celebrate(){winSound();for(let i=0;i<34;i++){const el=document.createElement("i");el.className="confetti";el.style.left=(10+Math.random()*80)+"vw";el.style.setProperty("--x",(Math.random()*180-90)+"px");el.style.animationDelay=(Math.random()*.35)+"s";document.body.appendChild(el);setTimeout(()=>el.remove(),2300)}for(let i=0;i<18;i++){const el=document.createElement("i");el.className="fire";el.style.setProperty("--x",(Math.random()*300-150)+"px");el.style.setProperty("--y",(Math.random()*260-130)+"px");document.body.appendChild(el);setTimeout(()=>el.remove(),1000)}}
function draw(){const a=list();if(!a.length)return alert("当前分类还没有菜品");const winner=a[Math.floor(Math.random()*a.length)],seq=[];for(let i=0;i<13;i++)seq.push(a[Math.floor(Math.random()*a.length)]);seq[11]=winner;$("draw").classList.add("show");$("result").classList.remove("show");$("drawTitle").textContent="正在抽取……";$("track").innerHTML=seq.map(f=>"<div class='mini'>"+visual(f,true)+"<b>"+esc(f.n)+"</b></div>").join("");const tr=$("track");tr.style.transition="none";tr.style.transform="translateX(0)";drawSound();requestAnimationFrame(()=>{tr.style.transition="transform 2.5s cubic-bezier(.1,.8,.15,1)";tr.style.transform="translateX(-"+(11*133-66)+"px)"});setTimeout(()=>{$("drawTitle").textContent="✨ 决定好了！";showResult(winner);history.push(winner);history=history.slice(-30);save("food_hist_v4",history);renderRecords()},2650)}
function renderRecords(){const arr=$("favTab").dataset.on==="1"?favorites:history;$("records").innerHTML=arr.length?arr.slice().reverse().map(f=>"<div class='row'>"+visual(f,true)+"<div><b>"+esc(f.n)+"</b><small>"+esc(f.cat)+" · "+esc(f.region||"我的菜单")+"</small></div></div>").join(""):"<div class='empty'>还没有记录</div>"}
document.querySelectorAll(".mood").forEach(b=>b.onclick=()=>{document.querySelectorAll(".mood").forEach(x=>x.classList.remove("on"));b.classList.add("on")});
document.querySelectorAll(".source").forEach(b=>b.onclick=()=>{source=b.dataset.source;category="全部";render()});
$("start").onclick=draw;$("again").onclick=draw;$("addFood").onclick=addFood;$("addCat").onclick=addCategory;
$("like").onclick=()=>{if(!current)return;if(!favorites.some(x=>x.n===current.n)){favorites.push(current);save("food_fav_v4",favorites)}$("like").textContent="💖 已收藏";renderRecords()};
$("favTab").onclick=()=>{$("favTab").dataset.on="1";renderRecords()};$("histTab").onclick=()=>{$("favTab").dataset.on="0";renderRecords()};
$("musicBtn").onclick=()=>$("musicPanel").classList.toggle("show");document.querySelectorAll("[data-mood]").forEach(b=>b.onclick=()=>{musicMode=b.dataset.mood;document.querySelectorAll("[data-mood]").forEach(x=>x.classList.toggle("on",x===b));startMusic(musicMode)});$("musicFile").onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;if(!userAudio)userAudio=new Audio();userAudio.src=URL.createObjectURL(f);userAudio.loop=true;userAudio.volume=.5;userAudio.play().then(()=>{$("musicBtn").classList.add("on");$("musicBtn").textContent="♫";$("musicPanel").classList.remove("show")}).catch(()=>alert("请点击一次右上角圆圈后再选择音乐"))};
try{render();renderRecords()}catch(err){console.error(err);$("details").innerHTML="<div class='empty'>页面数据正在恢复，请刷新一次页面。</div>"}
</script></body></html>
