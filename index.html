<body><main class="app">
<div class="top"><div class="brand">🍽️ 今天吃什么<small>让美食治愈你的每一天</small></div><button class="iconbtn" id="sound">🔊 音效开</button></div>
<section class="hero"><span class="pill">🍜 150+种美食 · 全国地域风味</span><h1>今天吃什么？</h1><p>选一点感觉，剩下的交给我。<br>抽到什么，就认真吃什么。</p></section>
<section class="card controls">
<div class="moods" id="moods"><button class="mood on" data-m="all">🎲 随便吃</button><button class="mood" data-m="spicy">🌶️ 想吃辣</button><button class="mood" data-m="meat">🥩 想吃肉</button><button class="mood" data-m="fresh">🥗 清爽</button><button class="mood" data-m="sweet">🍰 想吃甜</button><button class="mood" data-m="drink">🧋 想喝点</button></div>
<div class="fields"><div class="field"><label>预算</label><select id="budget"><option>¥20以内</option><option selected>¥20–50</option><option>¥50–100</option><option>¥100+</option></select></div><div class="field"><label>人数</label><select id="people"><option>一个人</option><option selected>两个人</option><option>一群人</option></select></div><div class="field"><label>口味</label><select id="taste"><option>随便</option><option>清淡</option><option>重口</option><option>酸辣</option><option>甜口</option></select></div></div>
<div class="custom"><input id="custom" placeholder="＋ 添加自己的美食，例如：红烧肉"><button id="add">加入美食库</button></div><div class="customhint">你添加的美食也会参加盲盒抽取</div>
<button class="start" id="start">🎁 开始决定今晚吃什么<small>快速卡片滚动 · 温柔音效 · 抽中有惊喜</small></button>
</section>
<section class="card draw" id="draw"><div class="drawtitle" id="drawtitle">正在挑选今晚的美食……</div><div class="trackbox"><div class="track" id="track"></div></div><div class="hint" id="hint">中间爱心停住的那一张，就是最终答案。</div></section>
<section class="card result" id="result"><div class="visual"><span class="tag" id="tag"></span><span class="visualnote">今晚就吃它 ✦</span><img id="foodimg" alt="美食插画"></div><div class="info"><div class="meta"><span class="cat" id="cat"></span><span class="hot">🔥 人气推荐</span></div><div class="name" id="name"></div><div class="desc" id="desc"></div><div class="metrics"><div class="metric"><b id="type"></b><span>美食类型</span></div><div class="metric"><b id="rec"></b><span>推荐指数</span></div><div class="metric"><b id="score"></b><span>美味指数</span></div></div><div class="region"><strong id="regionTitle"></strong><p id="regionText"></p></div><div class="actions"><button class="again" id="again">🎲 不想吃这个，再来一次</button><button class="like" id="like">❤️ 我喜欢，收藏它</button></div></div></section>
<section class="card records"><div class="tabs"><button class="tab on" data-tab="fav">❤️ 我喜欢的</button><button class="tab" data-tab="history">🕘 抽到的记录</button></div><div class="list" id="list"></div></section>
<div class="foot">美食是生活的小确幸 · 喜欢和抽取记录都可以单独删除</div></main>

function confetti(){let b=document.createElement('div');b.className='confetti';document.body.appendChild(b);for(let i=0;i<45;i++){let x=document.createElement('i');x.style.left=Math.random()*100+'vw';x.style.setProperty('--x',(Math.random()*80-40)+'vw');x.style.background=['#ed8069','#f0bc70','#9fbe9b','#c5a0d0'][i%4];x.style.animationDelay=Math.random()*.15+'s';b.appendChild(x)}setTimeout(()=>b.remove(),1700)}
function pool(){let p=mood==='all'?foods.slice():foods.filter(f=>f.m===mood);p=p.concat(custom);let recent=hist.slice(-7).map(x=>x.n);let fresh=p.filter(f=>!recent.includes(f.n));return fresh.length?fresh:p.length?p:foods}
function mini(f){return '<div class="mini"><span class="micon">'+f.e+'</span><b>'+esc(f.n)+'</b><small>'+esc(f.c)+'</small></div>'}
function renderList(){const arr=tab==='fav'?fav:hist;const list=$('list');if(!arr.length){list.innerHTML='<div class="empty">'+(tab==='fav'?'还没有收藏。抽到喜欢的美食后，点「我喜欢，收藏它」吧 ❤️':'还没有抽取记录。今晚先抽一份吧 ✨')+'</div>';return}list.innerHTML=arr.slice().reverse().map((x,i)=>'<div class="row"><div class="rowicon">'+x.e+'</div><div class="rowmain"><b>'+esc(x.n)+'</b><small>'+esc(x.c||'美食')+(tab==='history'?' · '+new Date(x.time).toLocaleDateString():'')+'</small></div><button class="del" data-i="'+i+'">删除</button></div>').join('');list.querySelectorAll('.del').forEach(btn=>btn.onclick=()=>{let idx=arr.length-1-Number(btn.dataset.i);arr.splice(idx,1);localStorage.setItem(tab==='fav'?'food_fav_v4':'food_hist_v4',JSON.stringify(arr));renderList()})}
function show(f){current=f;$('foodimg').src=foodSvg(f);$('tag').textContent=f.e+'  '+f.c;$('cat').textContent=f.c;$('name').textContent=f.n;$('desc').textContent=f.d;$('type').textContent=f.t;$('rec').textContent=f.r;$('score').textContent=f.s;$('regionTitle').textContent='📍 '+f.region;$('regionText').textContent=f.rd;$('like').textContent=fav.some(x=>x.n===f.n)?'💖 已收藏':'❤️ 我喜欢，收藏它';$('result').classList.add('show')}
function decide(){play();$('start').disabled=true;$('draw').classList.add('show');$('result').classList.remove('show');const p=pool(),winner=p[Math.floor(Math.random()*p.length)];let seq=[];for(let i=0;i<12;i++)seq.push(p[Math.floor(Math.random()*p.length)]);const wi=10;seq[wi]=winner;$('track').innerHTML=seq.map(mini).join('');const tr=$('track');tr.style.transition='none';tr.style.transform='translateX(0)';const cardW=124;const center=Math.min(innerWidth-28,760)/2-58;const target=-(wi*cardW)+center;requestAnimationFrame(()=>{tr.style.transition='transform 2.35s cubic-bezier(.08,.78,.12,1)';tr.style.transform='translateX('+target+'px)'});setTimeout(()=>{show(winner);hist.push({n:winner.n,e:winner.e,c:winner.c,time:Date.now()});hist=hist.slice(-50);localStorage.setItem('food_hist_v4',JSON.stringify(hist));renderList();play(true);confetti();$('start').disabled=false;$('drawtitle').textContent='✨ 决定好了';$('hint').textContent='中间爱心停住的就是它。';scrollTo({top:$('result').offsetTop-8,behavior:'smooth'})},2500)}
document.querySelectorAll('.mood').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mood').forEach(x=>x.classList.remove('on'));b.classList.add('on');mood=b.dataset.m;play()});
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');tab=b.dataset.tab;renderList()});
$('start').onclick=decide;$('again').onclick=decide;
$('like').onclick=()=>{if(!current)return;if(!fav.some(x=>x.n===current.n)){fav.push({...current,time:Date.now()});localStorage.setItem('food_fav_v4',JSON.stringify(fav))}renderList();$('like').textContent='💖 已收藏';play(true)};
$('add').onclick=()=>{let n=$('custom').value.trim();if(!n)return;let f={n,c:'自定义美食',d:'这是你亲自加入的专属美食，也会参加今晚的盲盒抽取。',e:'🍽️',m:'all',t:'自定义',r:'9.5',s:'9.5',region:'你的美食清单',rd:'这是你自己加入的美食，地区介绍可在以后继续补充。',img:'custom'};custom.push(f);localStorage.setItem('food_custom_v4',JSON.stringify(custom));$('custom').value='';play(true);alert('已加入美食库：'+n)};
$('sound').onclick=()=>{sound=!sound;localStorage.setItem('food_sound_v4',sound?'on':'off');$('sound').textContent=sound?'🔊 音效开':'🔇 音效关';if(sound)play()};
renderList();
