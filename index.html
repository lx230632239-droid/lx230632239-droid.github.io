<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8f1">
<title>今天吃什么 · 美食决定器</title>
<style>
*{box-sizing:border-box}
:root{--ink:#352821;--muted:#9b8a80;--cream:#fffaf5;--paper:#fff;--line:#eee1d8;--accent:#ef8069;--accent2:#e8a15f;--soft:#fff0e8}
body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#fff8f1;min-height:100vh}
body:before{content:"";position:fixed;z-index:-1;inset:0;background:radial-gradient(circle at 15% 4%,#ffe6c6 0,transparent 25%),radial-gradient(circle at 88% 8%,#ffe0e7 0,transparent 24%),linear-gradient(180deg,#fffaf6,#fff8f1 55%,#fffdfb)}
button,select,input{font:inherit}
button{cursor:pointer}
.page{width:min(760px,100%);margin:auto;padding:22px 18px 50px}
.top{display:flex;align-items:center;justify-content:space-between}
.logo{font-size:17px;font-weight:950;letter-spacing:-.3px}
.logo span{display:block;color:var(--muted);font-size:10px;font-weight:600;margin-top:3px}
.sound{border:1px solid var(--line);background:#ffffffc9;color:#725e54;border-radius:99px;padding:9px 12px;font-size:12px}
.hero{text-align:center;padding:32px 0 20px}
.eyebrow{display:inline-block;padding:7px 11px;background:#fff0e7;color:#c56b50;border-radius:99px;font-size:11px;font-weight:900}
h1{font-size:clamp(42px,12vw,64px);line-height:1;letter-spacing:-3px;margin:15px 0 10px}
.sub{color:var(--muted);font-size:13px;line-height:1.7}
.panel{background:#ffffffdc;border:1px solid #fff;border-radius:28px;padding:17px;box-shadow:0 18px 55px #81553b12;backdrop-filter:blur(10px)}
.moods{display:flex;gap:8px;overflow:auto;padding:2px 1px 3px;scrollbar-width:none}
.moods::-webkit-scrollbar{display:none}
.mood{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:99px;padding:9px 13px;color:#725f55;font-size:12px}
.mood.active{background:var(--ink);border-color:var(--ink);color:#fff}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:12px}
.field label{display:block;color:var(--muted);font-size:10px;font-weight:900;margin:0 0 5px}
.field select{width:100%;height:40px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);padding:0 8px;font-size:12px}
.more{margin-top:10px}
.more summary{list-style:none;color:#a08e84;font-size:11px;text-align:center;cursor:pointer;padding:4px}
.more summary::-webkit-details-marker{display:none}
.morebox{border-top:1px solid #f2e8e1;margin-top:6px;padding-top:11px}
.custom{display:flex;gap:7px}
.custom input{min-width:0;flex:1;height:39px;border:1px solid var(--line);border-radius:12px;padding:0 11px;outline:none;background:#fff}
.custom button{border:0;border-radius:12px;background:var(--soft);color:#9d5e4b;font-size:12px;font-weight:900;padding:0 13px}
.start{width:100%;border:0;border-radius:17px;padding:15px 14px;margin-top:13px;background:linear-gradient(135deg,#f19a73,#e96f75);color:#fff;box-shadow:0 12px 28px #e8796830;font-weight:950;font-size:16px}
.start small{display:block;font-size:10px;font-weight:500;opacity:.82;margin-top:3px}
.draw{display:none;margin-top:14px;text-align:center;background:#fff;border-radius:26px;padding:17px;box-shadow:0 18px 55px #81553b12}
.draw.show{display:block}
.drawtitle{font-size:12px;font-weight:900;margin-bottom:10px}
.trackbox{height:126px;border-radius:18px;overflow:hidden;background:#fff8f3;position:relative}
.trackbox:before{content:"";position:absolute;z-index:4;left:50%;top:0;bottom:0;width:2px;background:#ed7e6a;box-shadow:0 0 0 7px #fff0ea55;transform:translateX(-50%)}
.trackbox:after{content:"♥";position:absolute;z-index:5;left:50%;top:2px;transform:translateX(-50%);color:#ed7e6a;background:#fff;border-radius:50%;font-size:12px;padding:2px 5px}
.track{height:100%;display:flex;align-items:center;gap:9px;padding-left:calc(50% - 60px);will-change:transform}
.card{flex:0 0 120px;height:98px;border:1px solid #f0e0d7;border-radius:16px;background:#fff;text-align:center;overflow:hidden}
.card .emoji{display:block;font-size:34px;padding-top:9px}
.card b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 7px}
.card small{display:block;color:#aa988e;font-size:8px;margin-top:3px}
.drawhint{color:#a18f86;font-size:10px;margin-top:8px}
.result{display:none;margin-top:14px;overflow:hidden;background:#fff;border-radius:28px;box-shadow:0 20px 65px #81553b1c}
.result.show{display:block;animation:up .45s ease}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.photo{height:330px;background:#f5e5d8;position:relative}
.photo img{display:block;width:100%;height:100%;object-fit:cover}
.photo .tag{position:absolute;left:15px;top:15px;background:#ffffffe8;border-radius:99px;padding:7px 10px;font-size:10px;font-weight:900}
.photo .caption{position:absolute;right:15px;bottom:14px;color:#fff;font-size:11px;font-weight:900;text-shadow:0 2px 10px #0008}
.info{padding:21px 19px 20px}
.line{display:flex;align-items:center;justify-content:space-between;gap:8px}
.category{color:#c86a50;font-size:11px;font-weight:900}
.hot{font-size:10px;color:#a6652d;background:#fff2df;border-radius:99px;padding:6px 8px}
.name{font-size:34px;line-height:1.15;letter-spacing:-1.5px;font-weight:950;margin-top:7px}
.desc{color:#766860;font-size:13px;line-height:1.75;margin:9px 0 15px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.metric{background:#fffaf7;border:1px solid #f0e4dc;border-radius:14px;padding:10px 5px;text-align:center}
.metric b{display:block;font-size:14px;margin-top:2px}
.metric span{font-size:9px;color:#a18f86}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}
.actions button{border:0;border-radius:13px;padding:12px 7px;font-size:11px;font-weight:900}
.again{background:var(--ink);color:#fff}
.keep{background:#fff0f2;color:#b65b6b;border:1px solid #ffd9df!important}
.bottom{margin-top:14px;background:#ffffffb8;border:1px solid #fff;border-radius:20px;padding:14px 15px}
.bottomhead{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:900}
.clear{border:0;background:none;color:#ae9a90;font-size:10px}
.history{display:flex;gap:6px;overflow:auto;padding-top:10px;scrollbar-width:none}
.history::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 9px;font-size:10px;color:#76665d}
.empty{color:#aa988e;font-size:10px;padding:8px 0}
.note{text-align:center;color:#b0a098;font-size:10px;margin-top:16px}
.confetti{position:fixed;inset:0;z-index:99;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-18px;width:7px;height:12px;border-radius:2px;animation:fall 1.8s ease-out forwards}
@keyframes fall{to{transform:translate3d(var(--x),105vh,0) rotate(720deg);opacity:0}}
@media(max-width:520px){.page{padding:17px 13px 38px}.hero{padding-top:27px}h1{letter-spacing:-2px}.panel{padding:13px;border-radius:23px}.row{gap:7px}.photo{height:285px}.name{font-size:31px}}
</style>
</head>
<body>
<main class="page">
<div class="top"><div class="logo">🍽️ 今天吃什么<span>让美食治愈你的每一天</span></div><button class="sound" id="sound">🔊 音效开</button></div>

<section class="hero"><div class="eyebrow">✨ 今晚的选择，交给美食</div><h1>今天吃什么？</h1><div class="sub">不用纠结。告诉我一点点感觉，<br>剩下的，让我替你决定。</div></section>

<section class="panel">
<div class="moods" id="moods">
<button class="mood active" data-m="all">🎲 随便吃</button>
<button class="mood" data-m="spicy">🌶️ 想吃辣</button>
<button class="mood" data-m="meat">🥩 想吃肉</button>
<button class="mood" data-m="fresh">🥗 清爽</button>
<button class="mood" data-m="sweet">🍰 想吃甜</button>
<button class="mood" data-m="drink">🧋 想喝点</button>
</div>
<div class="row">
<div class="field"><label>预算</label><select id="budget"><option>¥20以内</option><option selected>¥20–50</option><option>¥50–100</option><option>¥100+</option></select></div>
<div class="field"><label>人数</label><select id="people"><option>一个人</option><option selected>两个人</option><option>一群人</option></select></div>
<div class="field"><label>口味</label><select id="taste"><option>随便</option><option>清淡</option><option>重口</option><option>酸辣</option><option>甜口</option></select></div>
</div>
<details class="more"><summary>＋ 更多设置</summary><div class="morebox"><div class="custom"><input id="custom" placeholder="添加你自己的美食，例如：妈妈做的红烧肉"><button id="add">加入</button></div></div></details>
<button class="start" id="start">🎁 开始决定今晚吃什么<small>卡片滚动 · 温柔音效 · 抽中有惊喜</small></button>
</section>

<section class="draw" id="draw"><div class="drawtitle" id="drawtitle">正在认真替你挑选……</div><div class="trackbox"><div class="track" id="track"></div></div><div class="drawhint" id="hint">别急，马上就停下来了。</div></section>

<section class="result" id="result">
<div class="photo"><span class="tag" id="tag"></span><span class="caption">今晚就吃它 ✦</span><img id="foodimg" alt=""></div>
<div class="info">
<div class="line"><span class="category" id="category"></span><span class="hot">🔥 人气推荐</span></div>
<div class="name" id="name"></div>
<div class="desc" id="desc"></div>
<div class="metrics">
<div class="metric"><b id="type">正餐</b><span>美食类型</span></div>
<div class="metric"><b id="rec">9.5</b><span>推荐指数</span></div>
<div class="metric"><b id="tasteScore">9.5</b><span>美味指数</span></div>
</div>
<div class="actions"><button class="again" id="again">🎲 不想吃这个，再来一次</button><button class="keep" id="keep">❤️ 就决定是它</button></div>
</div>
</section>

<section class="bottom"><div class="bottomhead"><span>🕘 最近决定</span><button class="clear" id="clear">清空</button></div><div class="history" id="history"></div></section>
<div class="note">美食是生活的小确幸 · 本地保存，不需要注册</div>
</main>
<script>
const base=[
['重庆火锅','火锅 · 热辣','红油翻滚、毛肚脆嫩，适合今晚热热闹闹吃一顿。','🌶️','spicy','正餐','9.6','9.7','hotpot,food'],
['螺蛳粉','面食 · 粉面','酸辣鲜香，独特汤底搭配爽滑米粉，重口快乐直接拉满。','🍜','noodle','主食','9.5','9.5','noodles,food'],
['韩式烤肉','烧烤 · 烤肉','滋滋冒油的烤肉配蘸料，适合今晚认真大口吃肉。','🥩','meat','正餐','9.4','9.6','korean,bbq'],
['新疆羊肉串','烧烤 · 夜宵','炭火香气十足，孜然一撒，夜宵氛围感马上到位。','🍢','meat','夜宵','9.3','9.5','lamb,skewer'],
['麻辣香锅','火锅 · 热辣','肉菜随心搭配，香辣过瘾，选择困难也能一锅解决。','🌶️','spicy','正餐','9.4','9.6','spicy,food'],
['寿司拼盘','日料 · 清爽','清爽精致，不想吃太油的时候，来一盘刚刚好。','🍣','fresh','主食','9.2','9.4','sushi,food'],
['炸鸡','快餐 · 炸物','外酥里嫩、热乎乎的炸鸡，今天就奖励自己一下。','🍗','meat','快餐','9.2','9.5','fried,chicken'],
['牛肉拌饭','正餐 · 饱腹','肉、饭、蔬菜一碗搞定，适合想吃饱又不想纠结。','🥘','meat','主食','9.1','9.3','beef,rice'],
['番茄牛腩面','面食 · 粉面','酸甜浓郁的番茄汤底配软嫩牛腩，暖胃又舒服。','🍅','fresh','主食','9.3','9.4','tomato,noodles'],
['烤鱼','烧烤 · 烤肉','鱼肉鲜嫩、汤汁香浓，特别适合多人一起慢慢吃。','🐟','fresh','正餐','9.4','9.5','grilled,fish'],
['小龙虾','海鲜 · 夜宵','蒜香、麻辣、十三香，夜晚快乐担当，越剥越上头。','🦞','spicy','夜宵','9.6','9.7','lobster,food'],
['潮汕牛肉火锅','火锅 · 清鲜','鲜切牛肉现涮，清鲜又满足，适合想吃肉但不想太重口。','🥩','meat','正餐','9.5','9.6','beef,hotpot'],
['肉夹馍','小吃 · 街头美食','外酥里软，卤肉香浓，简单却特别满足。','🥙','meat','小吃','9.0','9.3','roujiamo,food'],
['生煎包','小吃 · 街头美食','底部焦香、里面多汁，一口下去幸福感很强。','🥟','fresh','小吃','9.1','9.4','dumplings,food'],
['披萨','西餐 · 快餐','芝士拉丝、配料丰富，适合一个人放松或者一起分享。','🍕','fresh','西餐','9.0','9.3','pizza,food'],
['牛排','西餐 · 正餐','想吃点仪式感，就来一份外焦里嫩的牛排。','🥩','meat','正餐','9.2','9.4','steak,food'],
['芋圆烧仙草','甜品 · 甜点','Q弹芋圆配清凉仙草，甜而不腻，饭后很舒服。','🍧','sweet','甜品','9.1','9.4','dessert,food'],
['杨枝甘露','甜品 · 甜点','芒果、椰奶和西柚的清爽组合，喜欢水果甜品就选它。','🥭','sweet','甜品','9.3','9.5','mango,dessert'],
['珍珠奶茶','饮品 · 奶茶','经典奶茶，纠结的时候永远有一份稳定的快乐。','🧋','drink','饮品','9.2','9.5','bubbletea,drink'],
['生椰拿铁','饮品 · 咖啡','椰香和咖啡香很搭，清爽又有一点小小仪式感。','☕','drink','饮品','9.0','9.3','latte,coffee']
];
const F=a=>({n:a[0],c:a[1],d:a[2],e:a[3],m:a[4],t:a[5],r:a[6],s:a[7],q:a[8]});
let foods=base.map(F),custom=JSON.parse(localStorage.getItem('today_food_custom')||'[]').map(F),history=JSON.parse(localStorage.getItem('today_food_history')||'[]'),mood='all',current=null,sound=localStorage.getItem('today_food_sound')!=='off';
const $=id=>document.getElementById(id);
function img(f){return 'https://loremflickr.com/1200/800/'+encodeURIComponent(f.q)+'?lock='+Math.abs(f.n.split('').reduce((a,c)=>a+c.charCodeAt(0),0))}
function tone(win=false){if(!sound)return;try{let A=window.AudioContext||window.webkitAudioContext,a=new A(),ns=win?[392,523,659,784]:[330,392,440];ns.forEach((n,i)=>{let o=a.createOscillator(),g=a.createGain(),t=a.currentTime+i*.09;o.type='sine';o.frequency.value=n;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.045,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+.24)})}catch(e){}}
function confetti(){let b=document.createElement('div');b.className='confetti';document.body.appendChild(b);for(let i=0;i<55;i++){let x=document.createElement('i');x.style.left=Math.random()*100+'vw';x.style.setProperty('--x',(Math.random()*100-50)+'vw');x.style.background=['#ef8069','#f0bd72','#a7c49c','#c39bd2'][i%4];x.style.animationDelay=Math.random()*.22+'s';b.appendChild(x)}setTimeout(()=>b.remove(),2100)}
function eligible(){let p=mood==='all'?foods.slice():foods.filter(f=>f.m===mood);p=p.concat(custom);let recent=history.slice(-5).map(x=>x.n),fresh=p.filter(f=>!recent.includes(f.n));return fresh.length?fresh:(p.length?p:foods)}
function render(){let d=new Date().toDateString();$('history').innerHTML=history.length?history.slice(-10).reverse().map(x=>'<span class="chip">'+x.e+' '+x.n+'</span>').join(''):'<span class="empty">还没有决定过，今晚来第一顿吧 ✨</span>';$('sound').textContent=sound?'🔊 音效开':'🔇 音效关'}
function decide(){tone();$('start').disabled=true;$('result').classList.remove('show');$('draw').classList.add('show');let p=eligible(),win=p[Math.floor(Math.random()*p.length)],arr=[];for(let i=0;i<4;i++)arr.push(...p.slice().sort(()=>Math.random()-.5));let wi=arr.length-1-Math.floor(Math.random()*4);arr[wi]=win;$('track').innerHTML=arr.map(f=>'<div class="card"><span class="emoji">'+f.e+'</span><b>'+f.n+'</b><small>'+f.c+'</small></div>').join('');let target=-(wi*129)+(innerWidth<600?innerWidth/2-60:380-60),tr=$('track');tr.style.transition='none';tr.style.transform='translateX(0)';$('drawtitle').textContent='正在认真替你挑选……';$('hint').textContent='美食正在飞快掠过，马上就停下来了。';requestAnimationFrame(()=>{tr.style.transition='transform 4.8s cubic-bezier(.08,.72,.12,1)';tr.style.transform='translateX('+target+'px)'});setTimeout(()=>{current=win;$('foodimg').src=img(win);$('foodimg').onerror=()=>{$('foodimg').src='https://loremflickr.com/1200/800/food?lock=99'};$('tag').textContent=win.e+'  '+win.c;$('category').textContent=win.c;$('name').textContent=win.n;$('desc').textContent=win.d;$('type').textContent=win.t;$('rec').textContent=win.r;$('tasteScore').textContent=win.s;$('drawtitle').textContent='✨ 决定好了';$('hint').textContent='今晚不用再纠结，就吃它。';$('result').classList.add('show');history.push({n:win.n,e:win.e,t:Date.now()});history=history.slice(-60);localStorage.setItem('today_food_history',JSON.stringify(history));render();tone(true);confetti();$('start').disabled=false;scrollTo({top:$('result').offsetTop-10,behavior:'smooth'})},4950)}
document.querySelectorAll('.mood').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mood').forEach(x=>x.classList.remove('active'));b.classList.add('active');mood=b.dataset.m;tone()});
$('start').onclick=decide;$('again').onclick=decide;$('sound').onclick=()=>{sound=!sound;localStorage.setItem('today_food_sound',sound?'on':'off');if(sound)tone();render()};
$('keep').onclick=()=>{if(current){localStorage.setItem('today_food_favorite',JSON.stringify(current));$('keep').textContent='💖 已决定，就吃它';tone(true)}};
$('clear').onclick=()=>{history=[];localStorage.removeItem('today_food_history');render()};
$('add').onclick=()=>{let n=$('custom').value.trim();if(!n)return;let f=F([n,'我的私藏','你亲自加入的专属美食。','🍽️','custom','自定义','9.5','9.5','food']);custom.push(f);localStorage.setItem('today_food_custom',JSON.stringify(custom));$('custom').value='';alert('已加入盲盒：'+n)};
render();
</script>
</body>
</html>
