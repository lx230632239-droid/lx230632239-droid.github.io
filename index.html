<script>
"use strict";

/* =========================================================
   01. 应用状态
   ========================================================= */
const APP = {
  location: null,
  current: null,
  busy: false,
  filters: {
    platform: "all",
    budget: "all",
    category: "all",
    people: "all"
  }
};

const STORAGE_KEY = "food_box_history_v2";
const LEGACY_STORAGE_KEY = "food_box_history";
const WORKER = "https://restless-field-1986.lx230632239.workers.dev";
const $ = id => document.getElementById(id);

const CONFIG = {
  platform: [["all","随机平台"],["meituan","美团"],["taobao","淘宝闪购"],["eleme","饿了么"],["jd","京东秒送"]],
  budget: [["all","不限"],["20","¥20以内"],["40","¥40以内"],["60","¥60以内"],["100","¥100以内"]],
  category: [["all","随便"],["正餐","正餐"],["小吃","小吃"],["烧烤","烧烤"],["火锅","火锅"],["奶茶","奶茶"],["甜品","甜品"]],
  people: [["all","不限"],["single","单人餐"],["double","双人餐"],["2-3","2–3人餐"],["6-8","6–8人餐"]]
};

const PLATFORM = {
  meituan: { label: "美团外卖", url: "https://waimai.meituan.com/" },
  taobao: { label: "淘宝闪购", url: "https://tb.ele.me/" },
  eleme: { label: "饿了么", url: "https://tb.ele.me/" },
  jd: { label: "京东秒送", url: "https://www.jd.com/" }
};

/* =========================================================
   02. 通用 UI
   ========================================================= */
function setStatus(text) {
  $("status").textContent = text;
}

function showMessage(text) {
  const el = $("message");
  el.textContent = text;
  el.classList.add("show");
}

function hideMessage() {
  $("message").classList.remove("show");
}

function setBusy(buttonId, busy, busyText, normalText) {
  const el = $(buttonId);
  if (!el) return;
  el.disabled = busy;
  el.textContent = busy ? busyText : normalText;
}

function safeText(value, fallback = "—") {
  return value == null || String(value).trim() === "" ? fallback : String(value);
}

/* =========================================================
   03. 条件选择
   ========================================================= */
function renderFilters() {
  Object.entries(CONFIG).forEach(([key, items]) => {
    const box = $(key);
    box.replaceChildren();

    items.forEach(([value, label]) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "chip" + (APP.filters[key] === value ? " active" : "");
      button.textContent = label;

      button.addEventListener("click", () => {
        APP.filters[key] = value;
        [...box.children].forEach(item => item.classList.remove("active"));
        button.classList.add("active");
      });

      box.appendChild(button);
    });
  });
}

/* =========================================================
   04. 历史记录
   独立模块：支持单条删除、全部清空、坏数据自动修复
   ========================================================= */
function normalizeHistory(items) {
  if (!Array.isArray(items)) return [];

  const seen = new Set();
  return items
    .filter(item => item && typeof item === "object" && item.name)
    .map(item => ({
      id: String(item.id || item.name),
      name: String(item.name),
      distance: Number.isFinite(Number(item.distance)) ? Number(item.distance) : 0
    }))
    .filter(item => {
      if (seen.has(item.id)) return false;
      seen.add(item.id);
      return true;
    })
    .slice(0, 20);
}

function loadHistory() {
  try {
    const current = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    const normalized = normalizeHistory(current);
    if (normalized.length || current.length === 0) return normalized;

    const legacy = JSON.parse(localStorage.getItem(LEGACY_STORAGE_KEY) || "[]");
    return normalizeHistory(legacy);
  } catch (_) {
    return [];
  }
}

function writeHistory(items) {
  const clean = normalizeHistory(items);
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(clean));
    localStorage.removeItem(LEGACY_STORAGE_KEY);
    return true;
  } catch (_) {
    return false;
  }
}

function saveHistory(item) {
  const old = loadHistory();
  writeHistory([item, ...old.filter(x => String(x.id) !== String(item.id))]);
  renderHistory();
}

function formatDistance(meters) {
  const n = Number(meters) || 0;
  return n < 1000 ? Math.round(n) + "m" : (n / 1000).toFixed(1) + "km";
}

function renderHistory() {
  const box = $("history");
  const items = loadHistory();
  box.replaceChildren();

  if (!items.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "还没有抽取记录";
    box.appendChild(empty);
    return;
  }

  items.forEach(item => {
    const row = document.createElement("div");
    row.className = "historyItem";

    const main = document.createElement("div");
    main.className = "historyMain";
    main.textContent = "🍱 " + item.name + " · " + formatDistance(item.distance);

    const del = document.createElement("button");
    del.type = "button";
    del.className = "deleteBtn";
    del.dataset.historyId = item.id;
    del.textContent = "删除";

    row.append(main, del);
    box.appendChild(row);
  });
}

function deleteHistory(id) {
  const next = loadHistory().filter(item => String(item.id) !== String(id));
  if (!writeHistory(next)) {
    showMessage("浏览器暂时无法修改本地记录，请允许此网站使用本地存储后重试。");
    return;
  }
  renderHistory();
  showMessage("这条记录已删除。");
}

/* 使用事件委托，避免每次重绘都创建一套独立删除逻辑 */
$("history").addEventListener("click", event => {
  const button = event.target.closest("[data-history-id]");
  if (!button) return;
  event.preventDefault();
  event.stopPropagation();
  deleteHistory(button.dataset.historyId);
});

$("clearHistory").addEventListener("click", event => {
  event.preventDefault();
  event.stopPropagation();
  try {
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(LEGACY_STORAGE_KEY);
  } catch (_) {
    showMessage("无法清理本地记录，请检查浏览器存储权限。");
    return;
  }
  renderHistory();
  showMessage("最近抽取记录已全部清除。");
});

/* =========================================================
   05. 地理工具
   ========================================================= */
function distance(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const p = Math.PI / 180;
  const a1 = lat1 * p;
  const a2 = lat2 * p;
  const dl = (lat2 - lat1) * p;
  const dg = (lng2 - lng1) * p;
  const h = Math.sin(dl / 2) ** 2 +
    Math.cos(a1) * Math.cos(a2) * Math.sin(dg / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
}

async function reverseGeocode(lat, lng) {
  const url =
    "https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=zh-CN&lat=" +
    encodeURIComponent(lat) + "&lon=" + encodeURIComponent(lng);

  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 5000);

  try {
    const response = await fetch(url, {
      signal: controller.signal,
      cache: "no-store",
      headers: { Accept: "application/json" }
    });
    if (!response.ok) throw new Error("地址解析 HTTP " + response.status);
    return await response.json();
  } finally {
    clearTimeout(timer);
  }
}

async function getLocation() {
  if (APP.busy) return;

  if (!navigator.geolocation) {
    showMessage("当前浏览器不支持手机定位。");
    return;
  }

  setBusy("locateBtn", true, "📍 定位中…", "📍 获取当前位置");
  setStatus("正在定位");
  hideMessage();

  navigator.geolocation.getCurrentPosition(
    async position => {
      try {
        const lat = Number(position.coords.latitude);
        const lng = Number(position.coords.longitude);
        const accuracy = Math.round(Number(position.coords.accuracy) || 0);

        APP.location = { lat, lng, accuracy };

        $("locationText").innerHTML =
          "GPS 已获取<br><small>坐标 " +
          lat.toFixed(6) + "，" + lng.toFixed(6) +
          " · 精度约 " + accuracy + " 米</small>";

        setStatus("GPS已连接");

        try {
          const data = await reverseGeocode(lat, lng);
          const address = data.display_name || "";
          if (address) {
            $("locationText").innerHTML =
              "📍 " + address +
              "<br><small>GPS 精度约 " + accuracy + " 米</small>";
          }
        } catch (_) {
          /* 地址解析失败不影响 GPS */
        }
      } catch (error) {
        APP.location = null;
        showMessage("定位数据异常，请重新获取当前位置。");
        setStatus("定位失败");
      } finally {
        setBusy("locateBtn", false, "📍 定位中…", "📍 重新获取当前位置");
      }
    },
    error => {
      APP.location = null;
      const messages = {
        1: "定位权限被拒绝，请在浏览器设置里允许定位。",
        2: "暂时无法取得位置，请稍后重试。",
        3: "定位超时，请再试一次。"
      };
      showMessage(messages[error.code] || "定位失败，请再试一次。");
      setStatus("定位失败");
      setBusy("locateBtn", false, "📍 定位中…", "📍 获取当前位置");
    },
    {
      enableHighAccuracy: false,
      timeout: 10000,
      maximumAge: 30000
    }
  );
}

/* =========================================================
   06. 真实商家检索
   第一层：Nominatim
   第二层：Overpass
   两层并行/容错，任何一层成功即可继续
   ========================================================= */
function searchTerms(category) {
  if (category === "all") return ["restaurant", "cafe", "fast food"];
  return {
    正餐: ["restaurant"],
    小吃: ["fast food"],
    烧烤: ["barbecue"],
    火锅: ["hot pot"],
    奶茶: ["bubble tea"],
    甜品: ["dessert"]
  }[category] || ["restaurant"];
}

function buildQuery() {
  const { lat, lng } = APP.location;
  const radius = 8000;
  const category = APP.filters.category;

  let filter = '["amenity"~"restaurant|fast_food|cafe"]';
  if (category === "火锅") filter = '["amenity"="restaurant"]["cuisine"~"hot_pot|hotpot",i]';
  if (category === "烧烤") filter = '["amenity"~"restaurant|fast_food"]["cuisine"~"barbecue|bbq|grill",i]';
  if (category === "奶茶") filter = '["amenity"~"cafe|fast_food"]["cuisine"~"bubble_tea|tea",i]';
  if (category === "甜品") filter = '["amenity"~"cafe|fast_food"]["cuisine"~"dessert|cake|ice_cream",i]';

  return '[out:json][timeout:8];(nwr(around:' + radius + ',' + lat + ',' + lng + ')' + filter + ';);out center tags;';
}

function normalizePoi(item, lat, lng, category) {
  const tags = item.tags || {};
  const p = item.type === "node"
    ? { lat: item.lat, lng: item.lon }
    : { lat: item.center && item.center.lat, lng: item.center && item.center.lon };

  if (!tags.name || !Number.isFinite(Number(p.lat)) || !Number.isFinite(Number(p.lng))) {
    return null;
  }

  return {
    id: item.type + "-" + item.id,
    name: String(tags.name).trim(),
    lat: Number(p.lat),
    lng: Number(p.lng),
    distance: Math.round(distance(lat, lng, Number(p.lat), Number(p.lng))),
    address: [tags["addr:street"], tags["addr:housenumber"]].filter(Boolean).join(" "),
    category: category === "all" ? (tags.cuisine || "餐饮") : category,
    source: "nearby"
  };
}

function uniquePois(list) {
  const seen = new Set();
  return list
    .filter(Boolean)
    .sort((a, b) => a.distance - b.distance)
    .filter(item => {
      const key = item.name.toLowerCase().replace(/\s+/g, "");
      if (!key || seen.has(key)) return false;
      seen.add(key);
      return true;
    });
}

async function queryNominatim(lat, lng, term) {
  const box = 0.12;
  const url =
    "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=50&addressdetails=1&dedupe=1&accept-language=zh-CN" +
    "&q=" + encodeURIComponent(term) +
    "&viewbox=" + encodeURIComponent(
      (lng - box) + "," + (lat + box) + "," + (lng + box) + "," + (lat - box)
    ) +
    "&bounded=1";

  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 6000);

  try {
    const response = await fetch(url, {
      signal: controller.signal,
      cache: "no-store",
      headers: { Accept: "application/json" }
    });
    if (!response.ok) throw new Error("Nominatim HTTP " + response.status);

    const data = await response.json();
    return uniquePois(data.map(item => {
      const la = Number(item.lat);
      const lo = Number(item.lon);
      if (!item.display_name || !Number.isFinite(la) || !Number.isFinite(lo)) return null;

      return {
        id: "nom-" + item.place_id,
        name: item.name || item.display_name.split(",")[0],
        lat: la,
        lng: lo,
        distance: Math.round(distance(lat, lng, la, lo)),
        address: item.display_name,
        category: APP.filters.category === "all" ? "餐饮" : APP.filters.category,
        source: "nearby"
      };
    }));
  } finally {
    clearTimeout(timer);
  }
}

async function queryOverpass(lat, lng) {
  const query = buildQuery();
  const urls = [
    "https://overpass-api.de/api/interpreter?data=" + encodeURIComponent(query),
    "https://overpass.kumi.systems/api/interpreter?data=" + encodeURIComponent(query)
  ];

  for (const url of urls) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 7000);

    try {
      const response = await fetch(url, {
        signal: controller.signal,
        cache: "no-store",
        headers: { Accept: "application/json" }
      });

      if (!response.ok) continue;

      const data = await response.json();
      const list = uniquePois(
        (data.elements || []).map(item =>
          normalizePoi(item, lat, lng, APP.filters.category)
        )
      );

      if (list.length) return list;
    } catch (_) {
      /* 尝试下一个地图源 */
    } finally {
      clearTimeout(timer);
    }
  }

  return [];
}

async function fetchNearby() {
  if (!APP.location) throw new Error("请先获取当前位置。");

  const { lat, lng } = APP.location;
  const terms = searchTerms(APP.filters.category);

  setStatus("正在检索真实商家");

  /* 两种真实地图源并发，避免一个源卡住整个页面 */
  const nomPromise = Promise.all(
    terms.map(term => queryNominatim(lat, lng, term).catch(() => []))
  ).then(groups => uniquePois(groups.flat()));

  const overpassPromise = queryOverpass(lat, lng).catch(() => []);

  const results = await Promise.all([nomPromise, overpassPromise]);
  const merged = uniquePois(results.flat());

  if (!merged.length) {
    throw new Error("附近暂时没有检索到真实商家，请重新定位或换一个类别。");
  }

  /* 预算/人数没有可靠商品级价格数据时，不伪造过滤 */
  return merged.slice(0, 100);
}

/* =========================================================
   07. 抽取结果
   ========================================================= */
function chooseRandom(list) {
  if (!list.length) return null;

  /* 优先避开最近刚抽过的商家 */
  const recent = new Set(loadHistory().slice(0, 5).map(x => String(x.id)));
  const fresh = list.filter(x => !recent.has(String(x.id)));
  const pool = (fresh.length ? fresh : list).slice(0, 50);

  return pool[Math.floor(Math.random() * pool.length)];
}

function showResult(item) {
  APP.current = item;

  $("foodName").textContent = safeText(item.name);
  $("addr").textContent = safeText(item.address, "地址以地图/平台显示为准");
  $("distance").textContent = formatDistance(item.distance);
  $("price").textContent = Number(item.price) > 0 ? "¥" + Number(item.price).toFixed(2) : "到平台查看";
  $("kind").textContent = safeText(item.category, "餐饮");
  $("sourceTag").textContent = "真实附近商家";

  $("goMap").onclick = () => {
    const mapUrl =
      "https://www.openstreetmap.org/?mlat=" + encodeURIComponent(item.lat) +
      "&mlon=" + encodeURIComponent(item.lng) +
      "#map=18/" + encodeURIComponent(item.lat) +
      "/" + encodeURIComponent(item.lng);
    window.open(mapUrl, "_blank", "noopener");
  };

  $("goPlatform").onclick = async () => {
    const platformKey =
      APP.filters.platform === "all" ? "meituan" : APP.filters.platform;
    const platform = PLATFORM[platformKey] || PLATFORM.meituan;
    const name = item.name || "附近餐厅";

    try {
      await navigator.clipboard.writeText(name);
    } catch (_) {}

    window.open(platform.url, "_blank", "noopener");
    showMessage(
      "已复制「" + name + "」，并打开" + platform.label +
      "。进入后直接粘贴店名搜索即可。"
    );
  };

  $("result").classList.add("show");
  saveHistory({
    id: item.id,
    name: item.name,
    distance: item.distance
  });

  $("result").scrollIntoView({ behavior: "smooth", block: "start" });
}

/* =========================================================
   08. 核心抽取
   ========================================================= */
async function draw() {
  if (APP.busy) return;

  if (!APP.location) {
    showMessage("请先点击「获取当前位置」。");
    return;
  }

  APP.busy = true;
  setBusy("draw", true, "🎲 正在检索…", "🎲 开始抽外卖");
  $("result").classList.remove("show");
  hideMessage();

  try {
    const list = await fetchNearby();
    const item = chooseRandom(list);

    if (!item) throw new Error("没有找到符合条件的真实商家。");

    showResult(item);
    setStatus("抽取完成 · 找到 " + list.length + " 家真实商家");
  } catch (error) {
    console.error("draw failed:", error);
    setStatus("检索失败");
    showMessage(error && error.message ? error.message : "抽取失败，请重新定位后再试。");
  } finally {
    APP.busy = false;
    setBusy("draw", false, "🎲 正在检索…", "🎲 开始抽外卖");
  }
}

/* =========================================================
   09. AI 建议
   ========================================================= */
async function aiDecide() {
  if (!APP.current) {
    showMessage("先抽出一家真实商家，再让 AI 帮你决定。");
    return;
  }

  setBusy("aiBtn", true, "正在生成建议…", "让 AI 帮我决定");
  $("aiText").textContent = "正在分析这家店…";

  try {
    const response = await fetch(WORKER + "/food", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        mode: "food",
        name: APP.current.name,
        category: APP.current.category || "餐饮",
        budget: APP.filters.budget,
        people: APP.filters.people
      })
    });

    const data = await response.json().catch(() => ({}));
    if (!response.ok || !data.ok) {
      throw new Error(data.error || "AI服务暂不可用");
    }

    $("aiText").textContent =
      data.desc || data.taste || "今天就吃它，别纠结了。";
  } catch (error) {
    console.error("AI failed:", error);
    $("aiText").textContent =
      "AI暂时不可用，但不影响真实商家检索和抽取。";
  } finally {
    setBusy("aiBtn", false, "正在生成建议…", "让 AI 帮我决定");
  }
}

/* =========================================================
   10. 统一事件入口
   ========================================================= */
$("locateBtn").addEventListener("click", getLocation);
$("draw").addEventListener("click", draw);
$("again").addEventListener("click", draw);
$("aiBtn").addEventListener("click", aiDecide);

window.addEventListener("error", event => {
  console.error("App error:", event.error || event.message);
  setStatus("页面已加载 · 个别服务异常");
});

window.addEventListener("unhandledrejection", event => {
  console.error("Unhandled promise:", event.reason);
  setStatus("页面已加载 · 个别服务异常");
});

/* =========================================================
   11. 初始化
   ========================================================= */
renderFilters();
renderHistory();
setStatus("页面已就绪");
</script>
