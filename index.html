<div class="wrap">
<header>

  <div class="sub">把选择困难交给它。点一下，让命运决定今晚这一口。</div>
</header>

<div class="grid">
<section class="card main">

    <select id="category">

      <option value="主食">🍚 主食/正餐</option>
      <option value="面粉">🍜 面/粉/米线</option>
      <option value="火锅">🔥 火锅/热辣</option>
      <option value="烧烤">🥩 烤肉/烧烤</option>
      <option value="小吃">🥟 小吃/街头</option>
      <option value="快餐">🍗 快餐/炸物</option>
      <option value="甜品">🍰 甜品/甜食</option>
      <option value="饮品">🧋 奶茶/饮品</option>
      <option value="异国">🍣 日料/韩料/西餐</option>
      <option value="夜宵">🌙 夜宵</option>
    </select>
    <label class="toggle"><input id="avoid" type="checkbox" checked> 尽量不重复</label>
  </div>

  <section class="hero"><img id="heroImg" alt="美食照片"><div class="heroText"><span class="tag">FOOD DECISION · 今日盲盒</span><h2 id="heroTitle">今天让它替你决定</h2><p id="heroSub">不转盘、不纠结，直接给你一个答案。</p></div></section>
  <button id="spin" class="spin">🎲 开始帮我决定</button>
  <div id="result" class="result">
    <div class="emoji">🤔</div>
    <h2>今天吃什么？</h2>
    <p>别想了，交给我。</p>
  </div>
</section>

<aside class="card side">
  <h3>🎯 先告诉我你的心情</h3>
  <div class="quick">
    <button data-mood="all">✨ 随便都行</button><button data-mood="辣">🌶️ 想吃辣</button>
    <button data-mood="肉">🥩 想吃肉</button><button data-mood="清爽">🥗 清爽点</button>
    <button data-mood="甜">🍰 想吃甜</button><button data-mood="饮品">🧋 想喝饮品</button>
  </div>
  <h3>📊 今日记录</h3>
  <div class="stats"><div class="stat"><b id="count">0</b><span>今天决定</span></div><div class="stat"><b id="unique">0</b><span>不同美食</span></div><div class="stat"><b id="total">0</b><span>美食库存</span></div></div>
  <h3>🕘 最近决定</h3><div id="history" class="history"></div>
  <div class="actions"><button class="ghost" id="clear">清空记录</button><button class="ghost" id="surprise">✨ 全随机</button></div>
  <div class="tip">💡 <b>这版不再用转盘。</b> 每次抽取、照片、名称、分类和描述都来自同一个美食对象，彻底避免“指到 A、显示 B”的错配。</div>
</aside>
</div>
<footer>本页面为纯前端单文件应用 · 不需要登录 · 选择记录保存在你的浏览器本地</footer>
</div>

function imgFor(f){return IMG[f[0]==="火锅"?"hotpot":f[0]==="面粉"?"noodle":f[0]==="烧烤"?"bbq":f[0]==="饮品"?"tea":f[0]==="甜品"?"sweet":f[0]==="快餐"?"fast":f[0]==="异国"?"foreign":"meal"]}
function show(f){const im=imgFor(f);res.className="result show";res.innerHTML='<img src="'+im+'" alt="'+f[1]+'"><div><div class="eyebrow">'+f[0]+' · 今日答案</div><h2>'+f[2]+' '+f[1]+'</h2><p>'+f[3]+'</p><button class="again" id="again">不吃这个 · 再选一次</button></div>';document.getElementById("again").onclick=decide}
function decide(){if(busy)return;const a=pool();if(!a.length){alert("这个条件下今天没有可选项啦，换个分类试试～");return}busy=true;btn.disabled=true;const cover=document.createElement("div");cover.className="loading on";cover.innerHTML='<div class="loader"><div class="emoji">🍜</div><b>正在替你翻菜单……</b><span>正在排除纠结项 · 马上揭晓</span></div>';document.body.appendChild(cover);setTimeout(()=>{const f=a[Math.floor(Math.random()*a.length)],im=imgFor(f);today.push(key(f));history.unshift([new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"}),f[1],f[2],im]);save();show(f);render();cover.remove();busy=false;btn.disabled=false;res.scrollIntoView({behavior:"smooth",block:"center"})},1200)}
btn.onclick=decide;cat.onchange=render;avoid.onchange=render;document.querySelectorAll("[data-mood]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-mood]").forEach(x=>x.style.outline="none");b.style.outline="2px solid #ff9b87";mood=b.dataset.mood});
document.querySelectorAll(".quick button").forEach(b=>b.onclick=()=>{if(b.dataset.mood){mood=b.dataset.mood;decide()}});
document.querySelectorAll(".quick button").forEach(b=>b.onclick=()=>{mood=b.dataset.mood||"all";decide()});
document.getElementById("clear").onclick=()=>{today=[];history=[];save();render()};document.getElementById("surprise").onclick=()=>{cat.value="all";mood="all";avoid.checked=false;decide()};render();</script>
</body>
</html>
