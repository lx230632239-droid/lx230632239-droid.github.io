<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8f2">
<title>吃点啥？· 外卖盲盒</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f4f1;color:#241c18;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.app{max-width:760px;margin:auto;padding:14px 14px 70px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.brand{font-size:22px;font-weight:950}.sub{font-size:12px;color:#9a8d86;margin-top:3px}.status{font-size:11px;padding:7px 10px;border-radius:999px;background:#fff;border:1px solid #eadfd8}.hero{background:linear-gradient(135deg,#fff,#fff1e7);border:1px solid #eaded6;border-radius:24px;padding:22px 18px;text-align:center;box-shadow:0 12px 35px #5d38210d}.hero h1{font-size:30px;margin:4px 0 7px}.hero p{margin:0;color:#8f8179;font-size:13px}.filters{margin-top:14px;display:grid;gap:12px}.card{background:#fff;border:1px solid #ebe3de;border-radius:18px;padding:14px}.label{font-weight:850;font-size:13px;margin-bottom:9px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #e5dcd6;background:#fff;color:#6e625c;border-radius:999px;padding:8px 12px;font-size:12px}.chip.active{background:#241c18;color:#fff;border-color:#241c18}.draw{width:100%;margin-top:15px;border:0;border-radius:18px;padding:17px;background:linear-gradient(135deg,#ff7f61,#f0a15f);color:#fff;font-size:18px;font-weight:950;box-shadow:0 12px 25px #df795533}.draw:active{transform:scale(.98)}.draw.loading{opacity:.7}.stage{display:none;margin-top:14px;background:#17120f;color:#fff;border-radius:20px;padding:24px 15px;text-align:center;overflow:hidden}.stage.show{display:block}.slot{font-size:50px;display:inline-block;animation:spin 1s linear infinite}.stage h2{margin:8px 0 4px}.stage p{margin:0;color:#c8bcb5;font-size:12px}@keyframes spin{to{transform:rotate(360deg)}}.result{display:none;margin-top:14px}.result.show{display:block}.winner{background:#fff;border-radius:22px;border:1px solid #eadfd8;overflow:hidden;box-shadow:0 14px 40px #5d38210d}.cover{height:180px;background:linear-gradient(135deg,#fff0e8,#f3e7df);display:flex;align-items:center;justify-content:center;font-size:72px;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover;display:block}.body{padding:17px}.tag{display:inline-block;background:#fff0e9;color:#d55f49;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}.name{font-size:25px;font-weight:950;margin:9px 0 4px}.shop{font-size:14px;color:#746861}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.meta div{background:#f8f5f2;border-radius:12px;padding:10px 6px;text-align:center;font-size:12px}.meta b{display:block;font-size:15px;margin-bottom:3px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.action{border:0;border-radius:14px;padding:13px;font-weight:900}.meituan{background:#fff0c8;color:#6e4b00}.taobao{background:#ffe5dc;color:#c74728}.ghost{width:100%;margin-top:10px;border:1px solid #e6ddd7;background:#fff;border-radius:14px;padding:12px;font-weight:800}.section{margin-top:14px}.section h3{font-size:14px;margin:0 0 9px}.history{display:grid;gap:8px}.history div{background:#fff;border:1px solid #eee6e1;border-radius:13px;padding:11px;font-size:12px}.notice{font-size:11px;color:#9a8d86;line-height:1.6}.empty{text-align:center;color:#9a8d86;padding:20px 5px}.hidden{display:none!important}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><div class="brand">🍱 吃点啥？</div><div class="sub">真实外卖 · 随机盲盒</div></div>
    <div class="status" id="status">正在检测外卖源…</div>
  </div>

  <section class="card" style="margin-bottom:14px"><div class="label">📍 所在位置</div><div id="locationText" class="notice">尚未获取手机当前位置</div><button class="ghost" id="locateBtn">📍 获取当前位置</button></section>

  <section class="hero">
    <div style="font-size:42px">🎁</div>
    <h1>今天吃什么？</h1>
    <p>不用纠结，让盲盒替你决定。</p>
  </section>

  <div class="filters">
    <section class="card">
      <div class="label">平台</div>
      <div class="chips" id="platform">
        <button class="chip active" data-v="all">全部</button>
        <button class="chip" data-v="meituan">美团</button>
        <button class="chip" data-v="taobao">淘宝闪购</button>
      </div>
    </section>
    <section class="card">
      <div class="label">预算</div>
      <div class="chips" id="budget">
        <button class="chip active" data-v="all">不限</button>
        <button class="chip" data-v="20">¥20以内</button>
        <button class="chip" data-v="40">¥40以内</button>
        <button class="chip" data-v="60">¥60以内</button>
        <button class="chip" data-v="100">¥100以内</button>
      </div>
    </section>
    <section class="card">
      <div class="label">想吃什么</div>
      <div class="chips" id="category">
        <button class="chip active" data-v="all">随便</button>
        <button class="chip" data-v="正餐">正餐</button>
        <button class="chip" data-v="小吃">小吃</button>
        <button class="chip" data-v="烧烤">烧烤</button>
        <button class="chip" data-v="火锅">火锅</button>
        <button class="chip" data-v="奶茶">奶茶</button>
        <button class="chip" data-v="甜品">甜品</button>
      </div>
    </section>
  </div>
    <section class="card">
      <div class="label">几个人吃</div>
      <div class="chips" id="people">
        <button class="chip active" data-v="all">不限</button>
        <button class="chip" data-v="single">单人餐</button>
        <button class="chip" data-v="double">双人餐</button>
        <button class="chip" data-v="2-3">2–3人餐</button>
        <button class="chip" data-v="6-8">6–8人餐</button>
      </div>
    </section>

  <button class="draw" id="draw">🎲 开始抽外卖</button>
  <section class="stage" id="stage"><div class="slot">🎁</div><h2 id="stageTitle">正在寻找外卖……</h2><p id="stageText">筛选真实商家 · 随机盲盒</p></section>

  <section class="result" id="result">
    <div class="winner">
      <div class="cover" id="cover">🍜</div>
      <div class="body">
        <span class="tag" id="sourceTag">外卖盲盒</span>
        <div class="name" id="foodName">—</div>
        <div class="shop" id="shopName">—</div>
        <div class="meta"><div><b id="price">—</b>优惠价</div><div><b id="originalPrice">—</b>原价</div><div><b id="discount">—</b>折扣</div></div><div class="meta"><div><b id="shops">—</b>适用门店</div><div><b id="sales">—</b>销量</div><div><b id="stock">—</b>库存</div></div>
        <div class="actions">
          <button class="action meituan" id="goMeituan">🟢 去美团</button>
          <button class="action taobao" id="goTaobao">🟠 去淘宝闪购</button>
        </div>
        <button class="ghost" id="again">🎲 再抽一次</button>
      </div>
    </div>
    <div class="section card">
      <h3>🤖 AI 帮我决定</h3>
      <div id="aiText" class="notice">抽出真实外卖后，AI 可以帮你解释为什么今天适合吃它。</div>
      <button class="ghost" id="aiBtn">让 AI 帮我决定</button>
    </div>
  </section>

  <section class="section card">
    <h3>🕘 最近抽过</h3>
    <div id="history" class="history"><div class="empty">还没有抽取记录</div></div>
  </section>

  <section class="section card notice">
    <b>接入说明</b><br>
    当前页面使用手机 GPS 获取真实附近餐饮商家；价格、配送费等没有可靠来源时不会编造。商家详情通过地图查看。数据来源：OpenStreetMap。
  </section>
</div>

<script>
const WORKER="";
function safeHistory(){try{const v=JSON.parse(localStorage.getItem("delivery_history_v1")||"[]");return Array.isArray(v)?v:[]}catch(e){try{localStorage.removeItem("delivery_history_v1")}catch(_){}return []}}
const state={platform:"all",budget:"all",category:"all",people:"all",current:null,location:null,history:safeHistory()};
function $(id){return document.getElementById(id)}
function bindChips(id,key){document.querySelectorAll("#"+id+" .chip").forEach(b=>b.onclick=()=>{document.querySelectorAll("#"+id+" .chip").forEach(x=>x.classList.remove("active"));b.classList.add("active");state[key]=b.dataset.v})}
bindChips("platform","platform");bindChips("budget","budget");bindChips("category","category");bindChips("people","people");
let locationBusy=false;
function getLocation(){
 const btn=$("locateBtn");
 if(locationBusy)return;
 if(!navigator.geolocation){$("locationText").textContent="当前浏览器不支持手机定位";return}
 locationBusy=true;
 if(btn){btn.disabled=true;btn.textContent="📍 正在定位…"}
 $("locationText").innerHTML="正在获取当前位置…<br><span style="font-size:11px;color:#8f8179">请允许浏览器使用位置权限</span>";
 const finish=()=>{locationBusy=false;if(btn){btn.disabled=false;btn.textContent="📍 重新获取当前位置"}};
 navigator.geolocation.getCurrentPosition(async pos=>{
   try{
    const lat=Number(pos.coords.latitude),lng=Number(pos.coords.longitude),accuracy=Number(pos.coords.accuracy)||0;
    state.location={latitude:lat,longitude:lng,accuracy};
    $("locationText").innerHTML="GPS已获取 · 纬度 "+lat.toFixed(6)+" · 经度 "+lng.toFixed(6)+"<br><span style="font-size:11px;color:#8f8179">📍 当前精度约 "+Math.round(accuracy)+" 米</span>";
    $("status").textContent=accuracy>100?"GPS已连接 · 精度较弱":"GPS已连接 · 实时定位";
    try{
      const u="https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat="+encodeURIComponent(lat)+"&lon="+encodeURIComponent(lng)+"&zoom=18&addressdetails=1&accept-language=zh-CN";
      const r=await fetch(u,{cache:"no-store",headers:{"Accept":"application/json"}});
      if(r.ok){
       const d=await r.json(),ad=d.address||{};
       const parts=[ad.state||ad.province,ad.city||ad.town||ad.municipality||ad.county,ad.city_district||ad.district||ad.suburb,ad.road,ad.house_number].filter(Boolean);
       if(parts.length)$("locationText").innerHTML=parts.join(" · ")+"<br><span style="font-size:11px;color:#8f8179">📍 实时GPS · 精度约 "+Math.round(accuracy)+" 米</span>";
      }
    }catch(_){}
   }finally{finish()}
 },err=>{
   const m=err&&err.code===1?"请允许浏览器使用位置权限":err&&err.code===2?"暂时无法获取当前位置":err&&err.code===3?"定位超时，请重试":"当前位置获取失败";
   $("locationText").textContent=m;
   $("status").textContent="等待手机定位";
   finish();
 },{enableHighAccuracy:false,timeout:6000,maximumAge:30000});
 setTimeout(()=>{if(locationBusy){locationBusy=false;if(btn){btn.disabled=false;btn.textContent="📍 重新获取当前位置"}$("locationText").textContent="定位超过6秒，请检查手机定位权限后重试";$("status").textContent="等待手机定位"}},7000);
}
async function checkDeliverySource(){
 $("status").textContent=state.location?"GPS已连接 · 真实商家源可用":"等待手机定位";
 return !!state.location;
}
async function fetchLive(){
 if(!state.location?.latitude||!state.location?.longitude) throw new Error("请先获取手机当前位置");
 const lat=Number(state.location.latitude),lng=Number(state.location.longitude),radius=5000;
 const category=state.category==="all"?"":state.category;
 const categoryFilter=category==="火锅"?'["cuisine"~"hotpot",i]':category==="烧烤"?'["cuisine"~"barbecue|bbq|grill",i]':category==="奶茶"?'["cuisine"~"bubble_tea|tea",i]':category==="甜品"?'["cuisine"~"dessert|ice_cream|cake",i]':category==="小吃"?'["cuisine"~"snack|fast_food",i]':'';
 const q='[out:json][timeout:25];(nwr(around:'+radius+','+lat+','+lng+')[amenity=restaurant]'+categoryFilter+';nwr(around:'+radius+','+lat+','+lng+')[amenity=fast_food]'+categoryFilter+';);out center tags;';
 const endpoints=["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter"];
 let data=null,lastError="";
 for(const endpoint of endpoints){
  try{
   const r=await fetch(endpoint+"?data="+encodeURIComponent(q),{method:"GET",headers:{"Accept":"application/json"}});
   if(r.ok){data=await r.json();break}
   lastError="数据源HTTP "+r.status;
  }catch(e){lastError="数据源连接失败"}
 }
 if(!data) throw new Error(lastError||"附近真实商家源暂时不可用");
 const hav=(a,b,c,d)=>{const R=6371000,p=Math.PI/180,x=(c-a)*p,y=(d-b)*p,z=Math.sin(x/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y/2)**2;return R*2*Math.atan2(Math.sqrt(z),Math.sqrt(1-z))};
 const list=(data.elements||[]).map(x=>{
  const t=x.tags||{},p=x.type==="node"?{lat:x.lat,lon:x.lon}:{lat:x.center?.lat,lon:x.center?.lon};
  if(!t.name||p.lat==null||p.lon==null)return null;
  const d=Math.round(hav(lat,lng,p.lat,p.lon)),cuisine=String(t.cuisine||"");
  const cat=category||(cuisine||(t.amenity==="fast_food"?"小吃":"正餐"));
  const map="https://www.openstreetmap.org/?mlat="+encodeURIComponent(p.lat)+"&mlon="+encodeURIComponent(p.lon)+"#map=19/"+encodeURIComponent(p.lat)+"/"+encodeURIComponent(p.lon);
  return {source:"nearby",id:String(x.type)+"-"+String(x.id),name:String(t.name),price:0,originalPrice:0,discount:"",image:String(t.image||""),sales:"",stock:"",shops:1,category:cat,distance:d,url:map,lat:p.lat,lng:p.lon,address:[t["addr:street"],t["addr:housenumber"]].filter(Boolean).join(" ")};
 }).filter(Boolean).sort((a,b)=>a.distance-b.distance);
 const out=[],seen=new Set();
 for(const x of list){const k=x.name.toLowerCase();if(!seen.has(k)){seen.add(k);out.push(x)}if(out.length>=40)break}
 return out;
}
function saveHistory(x){state.history=[x,...state.history.filter(y=>y.name!==x.name)].slice(0,8);localStorage.setItem("delivery_history_v1",JSON.stringify(state.history));renderHistory()}
function renderHistory(){$("history").innerHTML=state.history.length?state.history.map(x=>"<div>"+x.emoji+" <b>"+x.name+"</b> · "+(x.shops?("适用"+x.shops+"家门店"):"")+" · ¥"+x.price+"</div>").join(""):'<div class="empty">还没有抽取记录</div>'}
function showResult(x){
 state.current=x;$("cover").innerHTML=x.image?`<img src="${x.image}" alt="">`:(x.emoji||"🍱");$("sourceTag").textContent="GPS附近真实商家";
 $("foodName").textContent=x.name;$("shopName").textContent=x.shops?"适用 "+x.shops+" 家门店":"淘宝闪购餐饮商品";$("price").textContent=x.price?"¥"+x.price:"到平台查看";$("originalPrice").textContent=x.originalPrice?"¥"+x.originalPrice:"—";$("discount").textContent=x.discount?x.discount+"折":"—";$("shops").textContent=x.shops||"1";$("sales").textContent=x.sales||"—";$("stock").textContent=x.distance!=null?(x.distance<1000?x.distance+"m":(x.distance/1000).toFixed(1)+"km"):"—";
 $("goMeituan").classList.remove("hidden");$("goTaobao").classList.remove("hidden");
 $("result").classList.add("show");$("result").scrollIntoView({behavior:"smooth",block:"start"});saveHistory(x);
}
async function draw(){
 $("draw").disabled=true;$("draw").classList.add("loading");$("stage").classList.add("show");$("result").classList.remove("show");
 try{
  $("stageTitle").textContent="正在连接外卖源……";await new Promise(r=>setTimeout(r,260));
  const list=await fetchLive();
  if(!list.length) throw new Error(state.platform==="meituan"?"美团官方实时接口尚未接入":"当前条件没有可抽取的实时外卖");
  $("stageTitle").textContent="正在随机盲盒……";await new Promise(r=>setTimeout(r,700));
  const x=list[Math.floor(Math.random()*list.length)];
  showResult({...x,emoji:"🍱",category:x.category||"正餐"});
  $("status").textContent="真实附近商家";
 }catch(e){
  $("status").textContent="外卖源暂不可用";
  alert(e.message||"外卖源暂时不可用，请稍后再试");
 }finally{
  $("stage").classList.remove("show");$("draw").disabled=false;$("draw").classList.remove("loading");
 }
}
async function openProvider(type){const x=state.current;if(!x)return;if(x.url){window.open(x.url,"_blank");return;}try{const r=await fetch(WORKER+"/delivery/detail?item_id="+encodeURIComponent(x.id),{cache:"no-store"});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||"暂无官方跳转链接");if(j.url)window.open(j.url,"_blank");else alert("该商品暂未返回可用的官方跳转链接。");}catch(e){alert(e.message||"暂时无法打开淘宝闪购");}}
$("draw").onclick=draw;$("again").onclick=draw;$("goMeituan").onclick=()=>openProvider("meituan");$("goTaobao").onclick=()=>openProvider("taobao");
$("aiBtn").onclick=async()=>{
 const x=state.current;if(!x)return;
 $("aiText").textContent="AI 正在帮你判断……";$("aiBtn").disabled=true;
 try{
  const r=await fetch(WORKER+"/food",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({mode:"decide",candidates:[{n:x.name,cat:x.category,region:x.shops||""}],people:state.people,requestText:"这是外卖盲盒抽中的真实商品，请给出简短、自然、不过度营销的选择理由"})});
  const j=await r.json();$("aiText").textContent=j.reason||"今天就吃它，别纠结了。";
 }catch(e){$("aiText").textContent="今天就吃它，别纠结了。"}finally{$("aiBtn").disabled=false}
};
renderHistory();
$("locateBtn").onclick=getLocation;

window.addEventListener("error",()=>{$("status").textContent="页面功能已加载，请重新操作"});
</script>
</body>
</html>
