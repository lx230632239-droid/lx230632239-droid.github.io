<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f3ef">
<title>吃点啥？· 外卖盲盒</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f3f0;color:#241c18;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.app{max-width:760px;margin:auto;padding:14px 14px 60px}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:14px}.brand{font-size:22px;font-weight:900}.sub{font-size:12px;color:#9a8d86;margin-top:3px}.status{font-size:11px;padding:7px 10px;border-radius:999px;background:#fff;border:1px solid #e8dfd9;white-space:nowrap}.hero{background:linear-gradient(135deg,#fff,#fff0e6);border:1px solid #eaded6;border-radius:24px;padding:22px 18px;text-align:center;box-shadow:0 10px 28px #5d382110}.heroIcon{font-size:42px}.hero h1{font-size:29px;margin:4px 0 7px}.hero p{margin:0;color:#8f8179;font-size:13px}.section{margin-top:14px}.card{background:#fff;border:1px solid #e9e1dc;border-radius:18px;padding:14px}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.sectionTitle b{font-size:14px}.sectionTitle span{font-size:11px;color:#a09189}.locationBox{background:#faf7f4;border-radius:14px;padding:12px;font-size:13px;line-height:1.7;min-height:54px}.locationBox small{color:#9a8d86}.btn{width:100%;border:1px solid #e4d9d2;background:#fff;border-radius:13px;padding:12px;font-weight:800;margin-top:9px}.btn:disabled{opacity:.55}.filters{display:grid;gap:10px}.filter{padding:13px;background:#fff;border:1px solid #e9e1dc;border-radius:16px}.label{font-size:13px;font-weight:850;margin-bottom:9px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid #e4dcd6;background:#fff;color:#6e625c;border-radius:999px;padding:8px 11px;font-size:12px}.chip.active{background:#241c18;color:#fff;border-color:#241c18}.draw{width:100%;margin-top:14px;border:0;border-radius:17px;padding:16px;background:linear-gradient(135deg,#ff7f61,#efa05d);color:#fff;font-size:18px;font-weight:900;box-shadow:0 10px 24px #df79552e}.draw:disabled{opacity:.6}.message{margin-top:10px;padding:11px 12px;border-radius:12px;background:#faf7f4;color:#806f66;font-size:12px;line-height:1.6;display:none}.message.show{display:block}.result{display:none}.result.show{display:block}.winner{background:#fff;border:1px solid #e9e1dc;border-radius:20px;overflow:hidden}.cover{height:170px;background:linear-gradient(135deg,#fff0e8,#f2e6dd);display:flex;align-items:center;justify-content:center;font-size:65px}.body{padding:16px}.tag{display:inline-block;background:#fff0e9;color:#d55f49;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}.name{font-size:24px;font-weight:950;margin:9px 0 3px}.addr{font-size:13px;color:#766a63;line-height:1.5}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.meta div{background:#f8f5f2;border-radius:11px;padding:9px 5px;text-align:center;font-size:11px}.meta b{display:block;font-size:14px;margin-bottom:3px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.action{border:0;border-radius:13px;padding:12px;font-weight:850}.map{background:#f0eee9;color:#4e463f}.platform{background:#fff0e8;color:#c6533d}.ai{margin-top:14px}.aiText{font-size:12px;line-height:1.7;color:#776a62;background:#faf7f4;border-radius:12px;padding:11px}.history{display:grid;gap:8px}.historyItem{background:#faf7f4;border-radius:12px;padding:10px 11px;font-size:12px}.empty{text-align:center;color:#a09189;padding:15px}.notice{font-size:11px;color:#9a8d86;line-height:1.7}.hidden{display:none!important}.spin{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:480px){.top{align-items:flex-start}.status{max-width:120px;overflow:hidden;text-overflow:ellipsis}.hero h1{font-size:27px}}
</style>
</head>
<body>
<main class="app">
<header class="top">
  <div><div class="brand">🍱 吃点啥？</div><div class="sub">真实附近餐饮 · 随机盲盒</div></div>
  <div class="status" id="status">页面已就绪</div>
</header>

<section class="hero"><div class="heroIcon">🎁</div><h1>今天吃什么？</h1><p>先选条件，再让盲盒替你决定。</p></section>

<section class="section card">
  <div class="sectionTitle"><b>① 当前位置</b><span>可选，不会阻塞页面</span></div>
  <div class="locationBox" id="locationText">尚未获取当前位置</div>
  <button class="btn" id="locateBtn">📍 获取当前位置</button>
</section>

<section class="section">
  <div class="sectionTitle"><b>② 吃什么条件</b><span>分组选择</span></div>
  <div class="filters">
    <div class="filter"><div class="label">平台偏好</div><div class="chips" id="platform"></div></div>
    <div class="filter"><div class="label">预算</div><div class="chips" id="budget"></div></div>
    <div class="filter"><div class="label">类别</div><div class="chips" id="category"></div></div>
    <div class="filter"><div class="label">人数</div><div class="chips" id="people"></div></div>
  </div>
</section>

<section class="section">
  <button class="draw" id="draw">🎲 开始抽外卖</button>
  <div class="message" id="message"></div>
</section>

<section class="section result" id="result">
  <div class="winner">
    <div class="cover" id="cover">🍱</div>
    <div class="body">
      <span class="tag" id="sourceTag">真实附近商家</span>
      <div class="name" id="foodName">—</div>
      <div class="addr" id="addr">—</div>
      <div class="meta">
        <div><b id="distance">—</b>距离</div>
        <div><b id="price">—</b>价格</div>
        <div><b id="kind">—</b>类别</div>
      </div>
      <div class="actions">
        <button class="action map" id="goMap">🗺️ 查看地图</button>
        <button class="action platform" id="goPlatform">🔎 查看平台</button>
      </div>
      <button class="btn" id="again">🎲 再抽一次</button>
    </div>
  </div>

  <div class="card ai">
    <div class="sectionTitle"><b>③ AI 帮我决定</b><span>抽中后使用</span></div>
    <div class="aiText" id="aiText">抽中商家后，AI 可以帮你快速给出选择理由。</div>
    <button class="btn" id="aiBtn">让 AI 帮我决定</button>
  </div>
</section>

<section class="section card">
  <div class="sectionTitle"><b>④ 最近抽过</b><span>本机保存</span></div>
  <div class="history" id="history"></div>
</section>

<section class="section card notice">
  <b>数据说明</b><br>
  核心抽取使用真实附近餐饮地图数据，不编造价格、销量或库存。当前版本把“实时外卖平台菜单/优惠”与“附近真实商家”严格分开；美团、淘宝闪购官方实时菜单需要对应平台开放接口权限，不能用假数据冒充。
</section>
</main>

<script>
"use strict";
const APP={location:null,current:null,busy:false,filters:{platform:"all",budget:"all",category:"all",people:"all"}};
const $=id=>document.getElementById(id);
const CONFIG={
 platform:[["all","全部"],["meituan","美团"],["taobao","淘宝闪购"]],
 budget:[["all","不限"],["20","¥20以内"],["40","¥40以内"],["60","¥60以内"],["100","¥100以内"]],
 category:[["all","随便"],["正餐","正餐"],["小吃","小吃"],["烧烤","烧烤"],["火锅","火锅"],["奶茶","奶茶"],["甜品","甜品"]],
 people:[["all","不限"],["single","单人餐"],["double","双人餐"],["2-3","2–3人餐"],["6-8","6–8人餐"]]
};
function setStatus(t){$("status").textContent=t}
function showMessage(t){const el=$("message");el.textContent=t;el.classList.add("show")}
function hideMessage(){$("message").classList.remove("show")}
function renderFilters(){
 Object.entries(CONFIG).forEach(([key,items])=>{
  const box=$(key);box.innerHTML="";
  items.forEach(([v,label])=>{
   const b=document.createElement("button");b.type="button";b.className="chip"+(APP.filters[key]===v?" active":"");b.textContent=label;
   b.onclick=()=>{APP.filters[key]=v;[...box.children].forEach(x=>x.classList.remove("active"));b.classList.add("active")};
   box.appendChild(b);
  });
 });
}
function loadHistory(){
 try{return JSON.parse(localStorage.getItem("food_box_history")||"[]")}catch(_){return []}
}
function saveHistory(x){
 try{const old=loadHistory().filter(v=>v.id!==x.id);localStorage.setItem("food_box_history",JSON.stringify([x,...old].slice(0,8)))}catch(_){}
 renderHistory();
}
function renderHistory(){
 const box=$("history"),items=loadHistory();box.innerHTML="";
 if(!items.length){box.innerHTML='<div class="empty">还没有抽取记录</div>';return}
 items.forEach(x=>{const d=document.createElement("div");d.className="historyItem";d.textContent="🍱 "+x.name+" · "+(x.distance<1000?x.distance+"m":(x.distance/1000).toFixed(1)+"km");box.appendChild(d)});
}
function distance(a,b,c,d){
 const R=6371000,p=Math.PI/180,la1=a*p,la2=c*p,dl=(c-a)*p,dg=(d-b)*p;
 const h=Math.sin(dl/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dg/2)**2;
 return R*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h));
}
async function getLocation(){
 if(APP.busy)return;
 if(!navigator.geolocation){showMessage("当前浏览器不支持手机定位。");return}
 APP.busy=true;$("locateBtn").disabled=true;$("locateBtn").textContent="📍 定位中…";setStatus("正在定位");hideMessage();
 navigator.geolocation.getCurrentPosition(async pos=>{
  try{
   const lat=Number(pos.coords.latitude),lng=Number(pos.coords.longitude),acc=Math.round(Number(pos.coords.accuracy)||0);
   APP.location={lat,lng,accuracy:acc};
   $("locationText").innerHTML="GPS 已获取<br><small>坐标 "+lat.toFixed(6)+"，"+lng.toFixed(6)+" · 精度约 "+acc+" 米</small>";
   setStatus("GPS已连接");
   // 地址解析单独执行，失败不会影响定位和抽取
   try{
    const url="https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat="+encodeURIComponent(lat)+"&lon="+encodeURIComponent(lng)+"&zoom=18&addressdetails=1&accept-language=zh-CN";
    const r=await fetch(url,{cache:"no-store"});
    if(r.ok){const d=await r.json(),a=d.address||{},parts=[a.state||a.province,a.city||a.town||a.municipality||a.county,a.city_district||a.district||a.suburb,a.road,a.house_number].filter(Boolean);if(parts.length)$("locationText").innerHTML=parts.join(" · ")+"<br><small>📍 实时GPS · 精度约 "+acc+" 米</small>"}
   }catch(_){}
  }finally{APP.busy=false;$("locateBtn").disabled=false;$("locateBtn").textContent="📍 重新获取当前位置"}
 },err=>{
  APP.busy=false;$("locateBtn").disabled=false;$("locateBtn").textContent="📍 重新获取当前位置";
  const msg=err&&err.code===1?"请允许浏览器使用位置权限":err&&err.code===2?"暂时无法获取当前位置":err&&err.code===3?"定位超时，请重试":"当前位置获取失败";
  $("locationText").textContent=msg;setStatus("等待定位");showMessage(msg);
 },{enableHighAccuracy:false,timeout:6000,maximumAge:30000});
}
function buildQuery(){
 const {lat,lng}=APP.location||{};
 if(!lat||!lng)throw new Error("请先获取当前位置，再抽取附近真实商家。");
 const c=APP.filters.category;
 const cf=c==="火锅"?'["cuisine"~"hotpot",i]':c==="烧烤"?'["cuisine"~"barbecue|bbq|grill",i]':c==="奶茶"?'["cuisine"~"bubble_tea|tea",i]':c==="甜品"?'["cuisine"~"dessert|ice_cream|cake",i]':c==="小吃"?'["cuisine"~"snack|fast_food",i]':"";
 return '[out:json][timeout:12];(nwr(around:5000,'+lat+','+lng+')[amenity=restaurant]'+cf+';nwr(around:5000,'+lat+','+lng+')[amenity=fast_food]'+cf+';);out center tags;';
}
async function fetchNearby(){
 const q=buildQuery(),urls=["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter"];
 let last="";
 for(const base of urls){
  const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),9000);
  try{
   const r=await fetch(base+"?data="+encodeURIComponent(q),{signal:ctl.signal,headers:{Accept:"application/json"}});
   if(!r.ok){last="数据源 HTTP "+r.status;continue}
   const data=await r.json();
   const list=(data.elements||[]).map(x=>{
    const t=x.tags||{},p=x.type==="node"?{lat:x.lat,lon:x.lon}:{lat:x.center?.lat,lon:x.center?.lon};
    if(!t.name||p.lat==null||p.lon==null)return null;
    const d=Math.round(distance(APP.location.lat,APP.location.lng,p.lat,p.lon));
    const cuisine=String(t.cuisine||"");
    return {id:x.type+"-"+x.id,name:String(t.name),lat:p.lat,lon:p.lon,distance:d,address:[t["addr:street"],t["addr:housenumber"]].filter(Boolean).join(" "),category:APP.filters.category==="all"?(cuisine||"餐饮"):APP.filters.category};
   }).filter(Boolean).sort((a,b)=>a.distance-b.distance);
   const seen=new Set(),out=[];
   for(const x of list){const k=x.name.toLowerCase();if(seen.has(k))continue;seen.add(k);out.push(x);if(out.length>=50)break}
   return out;
  }catch(e){last=e.name==="AbortError"?"数据源响应超时":"数据源连接失败"}finally{clearTimeout(timer)}
 }
 throw new Error(last||"附近真实商家数据暂时不可用");
}
function showResult(x){
 APP.current=x;$("foodName").textContent=x.name;$("addr").textContent=x.address||"地址以地图数据为准";$("distance").textContent=x.distance<1000?x.distance+"m":(x.distance/1000).toFixed(1)+"km";$("price").textContent="到平台查看";$("kind").textContent=x.category||"餐饮";$("goMap").onclick=()=>window.open("https://www.openstreetmap.org/?mlat="+x.lat+"&mlon="+x.lon+"#map=18/"+x.lat+"/"+x.lon,"_blank");$("goPlatform").onclick=()=>{showMessage("当前没有美团/淘宝闪购官方实时商品接口，已避免使用假链接或假价格。");};$("result").classList.add("show");saveHistory(x);$("result").scrollIntoView({behavior:"smooth",block:"start"})}
async function draw(){
 if(APP.busy)return;
 if(!APP.location){showMessage("请先点击「获取当前位置」。");return}
 APP.busy=true;$("draw").disabled=true;$("draw").textContent="🎲 正在寻找真实商家…";$("result").classList.remove("show");hideMessage();setStatus("查询真实商家");
 try{
  const list=await fetchNearby();
  if(!list.length)throw new Error("当前位置附近没有匹配的真实餐饮商家。可以扩大搜索范围或换一个类别。");
  showResult(list[Math.floor(Math.random()*list.length)]);setStatus("抽取完成");
 }catch(e){showMessage(e.message||"真实商家源暂时不可用");setStatus("数据源异常")}
 finally{APP.busy=false;$("draw").disabled=false;$("draw").textContent="🎲 开始抽外卖"}
}
async function aiDecide(){
 if(!APP.current){showMessage("先抽出一家真实商家，再让 AI 帮你决定。");return}
 $("aiBtn").disabled=true;$("aiText").textContent="正在生成建议…";
 try{
  const text="我抽到了「"+APP.current.name+"」，类别是"+(APP.current.category||"餐饮")+"，距离约"+APP.current.distance+"米。请用一句自然中文告诉我为什么现在可以吃它。";
  const r=await fetch("https://api.openai.com/v1/responses",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({model:"gpt-5.6-mini",input:text})});
  if(!r.ok)throw new Error("AI接口未配置");
  const j=await r.json(),out=j.output?.flatMap(v=>v.content||[]).map(v=>v.text).filter(Boolean).join("")||"今天就吃它，别纠结了。";$("aiText").textContent=out;
 }catch(_){$("aiText").textContent="AI服务暂时不可用，但不影响真实商家抽取。"}
 finally{$("aiBtn").disabled=false}
}
$("locateBtn").onclick=getLocation;$("draw").onclick=draw;$("again").onclick=draw;$("aiBtn").onclick=aiDecide;
renderFilters();renderHistory();
window.addEventListener("error",e=>{console.error("App error:",e.message);setStatus("页面已加载 · 某项服务异常")});
window.addEventListener("unhandledrejection",e=>{console.error("Unhandled:",e.reason);setStatus("页面已加载 · 某项服务异常")});
</script>
</body>
</html>
